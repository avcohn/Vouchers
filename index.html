<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>השוברים שלי</title>
<meta name="theme-color" content="#f6f2fb">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="השוברים שלי">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23b9a8f0'/><text x='50' y='68' font-size='52' text-anchor='middle'>🎟️</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23b9a8f0'/><text x='50' y='68' font-size='52' text-anchor='middle'>🎟️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#f6f2fb; --bg2:#eef5f8;
  --card:#ffffff; --ink:#2d2640; --muted:#7b7390; --line:#ece6f4;
  --primary:#8a78d8; --primary-soft:#ece7fb; --primary-ink:#5a48b0;
  --mint:#dff4ea; --mint-ink:#23805a;
  --peach:#ffe8d6; --peach-ink:#b0601f;
  --gray:#eceaf1; --gray-ink:#6f6980;
  --rose:#ffe3e8; --rose-ink:#b8384f;
  --radius:20px; --shadow:0 6px 22px rgba(90,72,176,.08), 0 1px 3px rgba(90,72,176,.06);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  font-family:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  color:var(--ink); background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%) fixed;
  min-height:100vh; font-size:16px; line-height:1.45;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:disabled{cursor:default}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(110px + var(--safe-b))}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login-card{width:100%;max-width:380px;background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:30px 22px}
.logo{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,#cdbff7,#ffd6e0);display:grid;place-items:center;font-size:32px;margin:0 auto 14px}
.login h1{text-align:center;margin:0 0 4px;font-size:24px}
.login p.sub{text-align:center;color:var(--muted);margin:0 0 22px}
.setup-note{background:var(--peach);color:var(--peach-ink);border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:16px}

/* ---------- fields ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.field .hint{font-weight:400;color:var(--muted)}
.input{width:100%;height:52px;border-radius:14px;border:1.5px solid var(--line);background:#fcfbfe;padding:0 14px;font-size:17px;outline:none;transition:border-color .15s,box-shadow .15s}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
.input.ltr{direction:ltr;text-align:right}
.input-money{position:relative}
.input-money .input{padding-left:40px}
.input-money span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600}
.err{color:var(--rose-ink);font-size:14px;margin-top:6px;min-height:0}
.preview{font-size:13px;color:var(--primary-ink);margin-top:6px}

/* ---------- buttons ---------- */
.btn{height:52px;border-radius:16px;padding:0 18px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s,opacity .15s,background .15s;position:relative;user-select:none}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.45}
.btn-block{width:100%}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(138,120,216,.35)}
.btn-soft{background:var(--primary-soft);color:var(--primary-ink)}
.btn-ghost{background:#f4f1f9;color:var(--ink)}
.btn-danger{background:var(--rose);color:var(--rose-ink)}
.btn.loading{color:transparent!important}
.btn.loading::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(120,100,200,.25);border-top-color:var(--primary-ink);animation:spin .7s linear infinite}
.btn-primary.loading::after{border-color:rgba(255,255,255,.35);border-top-color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.75);box-shadow:0 1px 3px rgba(90,72,176,.08)}
.icon-btn svg{width:20px;height:20px;stroke:var(--ink)}

/* ---------- header / summary ---------- */
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.top h1{font-size:24px;margin:0;font-weight:800;letter-spacing:-.3px}
.top .actions{display:flex;gap:8px}
.summary{background:linear-gradient(135deg,#d9cffb 0%,#fde0e7 55%,#dff1ec 100%);border-radius:24px;padding:18px 18px 16px;box-shadow:var(--shadow);margin-bottom:14px}
.summary .lbl{font-size:14px;color:#5b4f7a;font-weight:500}
.summary .total{font-size:38px;font-weight:800;line-height:1.1;margin:2px 0 12px}
.summary .stats{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.7);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600}
.pill b{font-weight:800}

/* ---------- filters ---------- */
.filters{margin-bottom:6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.8);border:1.5px solid var(--line);font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* ---------- groups / cards ---------- */
.group{margin-top:16px}
.group-head{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px 8px}
.group-head h2{margin:0;font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px}
.group-head .dot{width:10px;height:10px;border-radius:50%}
.group-head .sub{color:var(--muted);font-size:14px;font-weight:600}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px;border-inline-start:6px solid var(--accent,#cdbff7);animation:rise .25s ease both}
.card.used{opacity:.72}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card .company{font-size:13px;color:var(--muted);font-weight:600}
.card .type{font-size:19px;font-weight:800;margin:1px 0 2px;letter-spacing:.2px}
.card .vnum{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);background:#f6f4fa;border-radius:8px;padding:3px 8px;margin-top:4px}
.card .vnum.missing{color:var(--peach-ink);background:var(--peach)}
.status{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:5px 10px}
.st-active{background:var(--mint);color:var(--mint-ink)}
.st-partial{background:var(--peach);color:var(--peach-ink)}
.st-used{background:var(--gray);color:var(--gray-ink)}
.bal-row{display:flex;justify-content:space-between;align-items:flex-end;margin:14px 0 8px}
.bal{font-size:30px;font-weight:800;line-height:1}
.bal-lbl{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:4px}
.of{font-size:13.5px;color:var(--muted);text-align:left}
.bar{height:8px;background:#f1eef7;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent,#cdbff7);transition:width .35s}
.card-actions{display:grid;grid-template-columns:.8fr 1.2fr 1.2fr 44px;gap:7px;margin-top:14px}
.card-actions .btn{height:46px;font-size:14px;padding:0 4px;border-radius:14px;white-space:nowrap;min-width:0}
.card-actions .more{width:44px;padding:0}
.card-actions .more svg{width:20px;height:20px;stroke:var(--ink)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.empty .big{font-size:44px}

/* ---------- FAB ---------- */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + var(--safe-b));height:56px;padding:0 24px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 26px rgba(45,38,64,.3);z-index:20}
.fab:active{transform:translateX(-50%) scale(.97)}
.fab svg{width:20px;height:20px;stroke:#fff}

/* ---------- sheet ---------- */
.backdrop{position:fixed;inset:0;background:rgba(40,30,70,.32);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:92vh;overflow-y:auto;background:#fff;border-radius:26px 26px 0 0;padding:10px 18px calc(22px + var(--safe-b));z-index:41;transform:translateY(105%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s linear .28s;box-shadow:0 -10px 40px rgba(40,30,70,.18)}
.sheet.open{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.grab{width:44px;height:5px;border-radius:9px;background:#e2dcec;margin:0 auto 14px}
.sheet h3{margin:0 0 4px;font-size:21px;font-weight:800}
.sheet .lead{color:var(--muted);margin:0 0 18px;font-size:15px}
.sheet-actions{display:flex;gap:10px;margin-top:18px}
.sheet-actions .btn{flex:1;white-space:nowrap}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{height:50px;border-radius:14px;border:1.5px solid var(--line);background:#fcfbfe;font-weight:700;font-size:14px}
.seg button.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-ink)}
.suggest{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.suggest button{height:32px;padding:0 12px;border-radius:99px;background:#f4f1f9;font-size:13.5px;font-weight:600}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.quick button{height:34px;padding:0 12px;border-radius:10px;background:#f4f1f9;font-size:14px;font-weight:600}
.infobox{background:#f8f6fc;border-radius:16px;padding:12px 14px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.infobox .t{font-weight:700}
.infobox .s{font-size:13px;color:var(--muted)}

/* history / undo list */
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.hist li:last-child{border-bottom:0}
.hist .ic{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:16px}
.hist .main{flex:1;min-width:0}
.hist .t{font-weight:700;font-size:15px}
.hist .d{font-size:12.5px;color:var(--muted)}
.hist .amt{font-weight:800;font-size:15px}
.hist li.undone .t,.hist li.undone .amt{text-decoration:line-through;color:var(--muted)}
.pick li{cursor:pointer;border-radius:14px;border:1.5px solid transparent;padding:12px 10px;margin-bottom:6px;background:#faf8fd;border-bottom:1.5px solid transparent}
.pick li.sel{border-color:var(--primary);background:var(--primary-soft)}
.pick .radio{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid #cfc6e4}
.pick li.sel .radio{border:7px solid var(--primary)}
.section-title{font-weight:800;font-size:15px;margin:18px 0 8px}
.divider{height:1px;background:var(--line);margin:18px 0}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-150%);background:var(--ink);color:#fff;border-radius:16px;padding:12px 18px;font-weight:600;font-size:15px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.2);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-width:calc(100% - 32px);display:flex;gap:8px;align-items:center}
.toast.show{transform:translate(-50%,0)}
.toast.ok{background:#23805a}
.toast.bad{background:#b8384f}

.skeleton{height:170px;border-radius:var(--radius);background:linear-gradient(90deg,#fff 0%,#f5f2fa 50%,#fff 100%);background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:12px;box-shadow:var(--shadow)}
@keyframes sh{to{background-position:-200% 0}}
@media (min-width:600px){.wrap{padding-top:28px}}
</style>
</head>
<body>

<!-- ========== LOGIN ========== -->
<section class="login" id="loginView" hidden>
  <form class="login-card" id="loginForm" novalidate>
    <div class="logo">🎟️</div>
    <h1>השוברים שלי</h1>
    <p class="sub">כניסה אישית לניהול השוברים</p>
    <div class="setup-note" id="setupNote" hidden>
      צריך להגדיר את כתובת ה-Supabase והמפתח בראש הקוד (SUPABASE_URL ו-SUPABASE_ANON_KEY).
    </div>
    <div class="field">
      <label for="email">אימייל</label>
      <input class="input ltr" id="email" type="email" autocomplete="username" inputmode="email" required>
    </div>
    <div class="field">
      <label for="password">סיסמה</label>
      <input class="input ltr" id="password" type="password" autocomplete="current-password" required>
    </div>
    <div class="err" id="loginErr"></div>
    <button class="btn btn-primary btn-block" id="loginBtn" type="submit" style="margin-top:8px">כניסה</button>
  </form>
</section>

<!-- ========== MAIN ========== -->
<section id="mainView" hidden>
  <div class="wrap">
    <header class="top">
      <h1>השוברים שלי</h1>
      <div class="actions">
        <button class="icon-btn" id="refreshBtn" aria-label="רענון" title="רענון">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
        <button class="icon-btn" id="logoutBtn" aria-label="יציאה" title="יציאה">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        </button>
      </div>
    </header>

    <div class="summary" id="summary">
      <div class="lbl" id="sumLabel">יתרה כוללת</div>
      <div class="total num" id="sumTotal">—</div>
      <div class="stats" id="sumStats"></div>
    </div>

    <div class="filters">
      <div class="chips" id="companyChips"></div>
      <div class="chips" id="statusChips"></div>
    </div>

    <main id="list"></main>
  </div>

  <button class="fab" id="addBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    הוספת שובר
  </button>
</section>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   הגדרות — להחליף בערכים מ-Supabase → Project Settings → API
   ===================================================================== */
const SUPABASE_URL      = 'https://YOUR-PROJECT-ID.supabase.co';
const SUPABASE_ANON_KEY = 'YOUR-ANON-PUBLIC-KEY';

/* ===================================================================== */
const CFG = window.__VOUCHER_CFG || { url: SUPABASE_URL, key: SUPABASE_ANON_KEY };
const configured = !/YOUR-/.test(CFG.url + CFG.key);
const sb = configured ? window.supabase.createClient(CFG.url, CFG.key, {
  auth: { persistSession: true, autoRefreshToken: true, storageKey: 'vouchers-auth' }
}) : null;

const HTZ_TYPES = ['EAT ZONE', 'CHEF ZONE', 'ALL IN ZONE'];
const STATUS = {
  active:  { label: 'פעיל',         cls: 'st-active'  },
  partial: { label: 'נוצל חלקית',   cls: 'st-partial' },
  used:    { label: 'נוצל במלואו',  cls: 'st-used'    },
};
const ACCENTS = ['#b9a8f0', '#f7b7c8', '#9fd8c3', '#ffc9a3', '#a9cdf2', '#e6c3f0', '#f3dd8e'];

const state = { vouchers: [], actions: [], loaded: false, fCompany: 'all', fStatus: 'all' };
let busy = false;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = new Intl.NumberFormat('he-IL', { maximumFractionDigits: 2 });
const money = n => nf.format(Number(n) || 0) + ' ₪';
const dtf = new Intl.DateTimeFormat('he-IL', { day: 'numeric', month: 'numeric', year: '2-digit', hour: '2-digit', minute: '2-digit' });
const fmtDate = s => dtf.format(new Date(s));
const normCompany = s => String(s || '').trim().replace(/\s+/g, ' ').toUpperCase();
function normType(company, type) {
  const t = String(type || '').trim().replace(/\s+/g, ' ');
  if (normCompany(company) === 'HTZ') {
    const k = t.replace(/[^A-Za-z]/g, '').toUpperCase();
    if (k === 'EATZONE' || k === 'EAT') return 'EAT ZONE';
    if (k === 'CHEFZONE' || k === 'CHEF') return 'CHEF ZONE';
    if (k === 'ALLINZONE' || k === 'ALLIN') return 'ALL IN ZONE';
    return null;
  }
  return t ? t.toUpperCase() : null;
}
const parseAmount = s => {
  const n = Number(String(s || '').replace(/[₪\s]/g, '').replace(',', '.'));
  return Number.isFinite(n) ? Math.round(n * 100) / 100 : NaN;
};
const statusOf = v => Number(v.balance) <= 0 ? 'used' : Number(v.balance) >= Number(v.initial_amount) ? 'active' : 'partial';
function accentOf(company) {
  if (company === 'HTZ') return ACCENTS[0];
  if (company === 'BUYME') return ACCENTS[1];
  let h = 0; for (const c of company) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return ACCENTS[2 + (h % (ACCENTS.length - 2))];
}
const undoableOf = id => state.actions.filter(a => a.voucher_id === id && a.action === 'use' && !a.undone_at);
const errMsg = e => (e && (e.message || e.error_description)) || 'משהו השתבש. נסה שוב.';

function toast(msg, kind = 'ok') {
  const t = $('#toast');
  t.className = 'toast ' + kind;
  t.textContent = (kind === 'ok' ? '✓ ' : '') + msg;
  requestAnimationFrame(() => t.classList.add('show'));
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), kind === 'ok' ? 2200 : 3800);
}

/* מונע לחיצה כפולה: כל פעולת שמירה עוברת כאן */
async function guarded(btn, fn) {
  if (busy) return;
  busy = true;
  document.querySelectorAll('.sheet .btn, .card-actions .btn').forEach(b => b.disabled = true);
  if (btn) { btn.classList.add('loading'); btn.disabled = true; }
  try { await fn(); }
  catch (e) { console.error(e); toast(errMsg(e), 'bad'); }
  finally {
    busy = false;
    if (btn) { btn.classList.remove('loading'); btn.disabled = btn.dataset.off === '1'; }
    document.querySelectorAll('.sheet .btn, .card-actions .btn').forEach(b => b.disabled = b.dataset.off === '1');
  }
}

async function rpc(fn, args) {
  const { data, error } = await sb.rpc(fn, args || {});
  if (error) throw error;
  return data;
}

/* ---------- data ---------- */
async function load({ quiet = false } = {}) {
  if (!quiet && !state.loaded) $('#list').innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
  let data = await rpc('voucher_state');
  if (!data.seeded) {                     // נתונים התחלתיים — פעם אחת בלבד
    await rpc('voucher_seed');
    data = await rpc('voucher_state');
  }
  state.vouchers = data.vouchers || [];
  state.actions = data.actions || [];
  state.loaded = true;
  render();
}

/* ---------- render ---------- */
function render() {
  const companies = [...new Set(state.vouchers.map(v => v.company))].sort((a, b) => {
    const order = c => c === 'HTZ' ? 0 : c === 'BUYME' ? 1 : 2;
    return order(a) - order(b) || a.localeCompare(b, 'he');
  });
  if (state.fCompany !== 'all' && !companies.includes(state.fCompany)) state.fCompany = 'all';

  // chips
  $('#companyChips').innerHTML = [['all', 'כל החברות'], ...companies.map(c => [c, c])]
    .map(([k, l]) => `<button class="chip ${state.fCompany === k ? 'on' : ''}" data-company="${esc(k)}">${esc(l)}</button>`).join('');
  $('#statusChips').innerHTML = [['all', 'כל הסטטוסים'], ['active', 'פעיל'], ['partial', 'נוצל חלקית'], ['used', 'נוצל במלואו']]
    .map(([k, l]) => `<button class="chip ${state.fStatus === k ? 'on' : ''}" data-status="${k}">${l}</button>`).join('');

  const shown = state.vouchers.filter(v =>
    (state.fCompany === 'all' || v.company === state.fCompany) &&
    (state.fStatus === 'all' || statusOf(v) === state.fStatus));

  // summary
  const filtered = state.fCompany !== 'all' || state.fStatus !== 'all';
  const total = shown.reduce((s, v) => s + Number(v.balance), 0);
  const cnt = { active: 0, partial: 0, used: 0 };
  shown.forEach(v => cnt[statusOf(v)]++);
  $('#sumLabel').textContent = filtered ? 'יתרה בסינון הנוכחי' : 'יתרה כוללת';
  $('#sumTotal').textContent = money(total);
  $('#sumStats').innerHTML =
    `<span class="pill"><b>${shown.length}</b> שוברים</span>` +
    `<span class="pill">פעילים <b>${cnt.active}</b></span>` +
    `<span class="pill">חלקית <b>${cnt.partial}</b></span>` +
    `<span class="pill">נוצלו <b>${cnt.used}</b></span>`;

  // list
  if (!state.vouchers.length) {
    $('#list').innerHTML = '<div class="empty"><div class="big">🎟️</div>אין עדיין שוברים. הוסף את הראשון.</div>';
    return;
  }
  if (!shown.length) {
    $('#list').innerHTML = '<div class="empty"><div class="big">🔍</div>אין שוברים שמתאימים לסינון.</div>';
    return;
  }
  const rank = { active: 0, partial: 1, used: 2 };
  $('#list').innerHTML = companies.map(c => {
    const items = shown.filter(v => v.company === c)
      .sort((a, b) => rank[statusOf(a)] - rank[statusOf(b)] || a.created_at.localeCompare(b.created_at));
    if (!items.length) return '';
    const sub = items.reduce((s, v) => s + Number(v.balance), 0);
    const accent = accentOf(c);
    return `<section class="group" data-group="${esc(c)}">
      <div class="group-head"><h2><span class="dot" style="background:${accent}"></span>${esc(c)}</h2>
        <span class="sub"><span class="num">${money(sub)}</span> · ${items.length} שוברים</span></div>
      ${items.map(v => cardHTML(v, accent)).join('')}
    </section>`;
  }).join('');
}

function cardHTML(v, accent) {
  const st = statusOf(v);
  const pct = Math.max(0, Math.min(100, Number(v.balance) / Number(v.initial_amount) * 100));
  const canUndo = undoableOf(v.id).length > 0;
  const used = st === 'used';
  return `<article class="card ${used ? 'used' : ''}" style="--accent:${accent}" data-id="${v.id}">
    <div class="card-top">
      <div>
        <div class="company">${esc(v.company)}</div>
        <div class="type">${esc(v.voucher_type)}</div>
        ${v.voucher_number
          ? `<span class="vnum"># <span class="num">${esc(v.voucher_number)}</span></span>`
          : `<span class="vnum missing">ללא מספר שובר</span>`}
      </div>
      <span class="status ${STATUS[st].cls}">${STATUS[st].label}</span>
    </div>
    <div class="bal-row">
      <div><div class="bal-lbl">יתרה</div><div class="bal num">${money(v.balance)}</div></div>
      <div class="of">מתוך <span class="num">${money(v.initial_amount)}</span></div>
    </div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="card-actions">
      <button class="btn btn-soft" data-act="full" ${used ? 'disabled data-off="1"' : ''}>נוצל</button>
      <button class="btn btn-soft" data-act="partial" ${used ? 'disabled data-off="1"' : ''}>נוצל חלקית</button>
      <button class="btn btn-ghost" data-act="undo" ${canUndo ? '' : 'disabled data-off="1"'}>ביטול ניצול</button>
      <button class="btn btn-ghost more" data-act="more" aria-label="פרטים והיסטוריה">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M12 5h.01M12 12h.01M12 19h.01"/></svg>
      </button>
    </div>
  </article>`;
}

/* ---------- sheet ---------- */
function openSheet(html) {
  $('#sheetBody').innerHTML = html;
  $('#backdrop').classList.add('open');
  $('#sheet').classList.add('open');
  $('#sheet').scrollTop = 0;
}
function closeSheet() {
  if (busy) return;
  $('#backdrop').classList.remove('open');
  $('#sheet').classList.remove('open');
}
$('#backdrop').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

const findV = id => state.vouchers.find(v => v.id === id);
const infoBox = v => `<div class="infobox"><div><div class="t">${esc(v.company)} · ${esc(v.voucher_type)}</div>
  <div class="s">${v.voucher_number ? '# <span class="num">' + esc(v.voucher_number) + '</span>' : 'ללא מספר שובר'}</div></div>
  <div style="text-align:left"><div class="s">יתרה</div><div class="t num">${money(v.balance)}</div></div></div>`;

/* נוצל במלואו — עם אישור */
function openFull(v) {
  openSheet(`<h3>לסמן שהשובר נוצל?</h3>
    <p class="lead">היתרה תתאפס והשובר יעבור לסטטוס ״נוצל במלואו״. אפשר לבטל אחר כך.</p>
    ${infoBox(v)}
    <div class="sheet-actions">
      <button class="btn btn-primary" id="confirmFull">כן, נוצל (${money(v.balance)})</button>
      <button class="btn btn-ghost" data-close>ביטול</button>
    </div>`);
  $('#confirmFull').onclick = e => guarded(e.currentTarget, async () => {
    await rpc('voucher_use', { p_voucher_id: v.id, p_amount: null, p_full: true });
    await load({ quiet: true });
    busy = false; closeSheet();
    toast(`השובר סומן כנוצל במלואו`);
  });
}

/* נוצל חלקית — הזנת סכום */
function openPartial(v) {
  const max = Number(v.balance);
  openSheet(`<h3>ניצול חלקי</h3>
    <p class="lead">כמה נוצל מהשובר?</p>
    ${infoBox(v)}
    <form id="partialForm" novalidate>
      <div class="field">
        <label for="useAmt">סכום שנוצל <span class="hint">(עד ${money(max)})</span></label>
        <div class="input-money"><input class="input num" id="useAmt" inputmode="decimal" autocomplete="off" placeholder="0"><span>₪</span></div>
        <div class="err" id="useErr"></div>
        <div class="preview" id="usePrev"></div>
      </div>
      <div class="sheet-actions">
        <button class="btn btn-primary" id="savePartial" type="submit">עדכון יתרה</button>
        <button class="btn btn-ghost" type="button" data-close>ביטול</button>
      </div>
    </form>`);
  const inp = $('#useAmt'), btn = $('#savePartial');
  const check = () => {
    const a = parseAmount(inp.value);
    let err = '';
    if (inp.value.trim() === '') err = '';
    else if (!(a > 0)) err = 'יש להזין סכום גדול מ-0';
    else if (a > max) err = `הסכום גבוה מהיתרה (${money(max)})`;
    $('#useErr').textContent = err;
    $('#usePrev').textContent = (!err && a > 0) ? `יתרה אחרי העדכון: ${money(max - a)}` : '';
    const ok = !err && a > 0;
    btn.dataset.off = ok ? '' : '1';
    btn.disabled = !ok || busy;
    return ok;
  };
  inp.addEventListener('input', check);
  check();
  setTimeout(() => inp.focus(), 250);
  $('#partialForm').onsubmit = e => {
    e.preventDefault();
    if (!check()) return;
    const a = parseAmount(inp.value);
    guarded(btn, async () => {
      await rpc('voucher_use', { p_voucher_id: v.id, p_amount: a, p_full: false });
      await load({ quiet: true });
      busy = false; closeSheet();
      toast(`נוצלו ${money(a)} · נותרו ${money(max - a)}`);
    });
  };
}

/* ביטול ניצול — בחירת הפעולה לביטול */
function openUndo(v) {
  const list = undoableOf(v.id).slice().reverse();
  if (!list.length) return toast('אין ניצולים לביטול בשובר הזה', 'bad');
  let sel = list[0].id;
  openSheet(`<h3>ביטול ניצול</h3>
    <p class="lead">בחר איזה ניצול לבטל — הסכום יחזור ליתרה.</p>
    ${infoBox(v)}
    <ul class="hist pick" id="undoList">
      ${list.map(a => `<li data-aid="${a.id}" class="${a.id === sel ? 'sel' : ''}">
        <span class="radio"></span>
        <div class="main"><div class="t">${a.is_full ? 'ניצול מלא' : 'ניצול חלקי'}</div><div class="d">${fmtDate(a.created_at)}</div></div>
        <div class="amt num">${money(a.amount)}</div></li>`).join('')}
    </ul>
    <div class="sheet-actions">
      <button class="btn btn-primary" id="confirmUndo"></button>
      <button class="btn btn-ghost" data-close>סגירה</button>
    </div>`);
  const upd = () => {
    const a = list.find(x => x.id === sel);
    $('#confirmUndo').textContent = `החזרת ${money(a.amount)}`;
    document.querySelectorAll('#undoList li').forEach(li => li.classList.toggle('sel', Number(li.dataset.aid) === sel));
  };
  $('#undoList').onclick = e => { const li = e.target.closest('li'); if (li && !busy) { sel = Number(li.dataset.aid); upd(); } };
  upd();
  $('#confirmUndo').onclick = e => guarded(e.currentTarget, async () => {
    const a = list.find(x => x.id === sel);
    await rpc('voucher_undo', { p_action_id: a.id });
    await load({ quiet: true });
    busy = false; closeSheet();
    const nv = findV(v.id);
    toast(`הניצול בוטל · ${money(a.amount)} חזרו ליתרה${nv ? ' (' + STATUS[statusOf(nv)].label + ')' : ''}`);
  });
}

/* פרטים, היסטוריה, השלמת מספר, מחיקה */
function openDetails(v) {
  const acts = state.actions.filter(a => a.voucher_id === v.id).slice().reverse();
  const row = a => {
    const map = {
      create: ['🎟️', 'נוסף לרשימה', 'var(--primary-soft)', '+'],
      use:    ['💳', a.is_full ? 'ניצול מלא' : 'ניצול חלקי', 'var(--peach)', '−'],
      undo:   ['↩️', 'ביטול ניצול', 'var(--mint)', '+'],
      edit:   ['✏️', a.note || 'עריכה', '#f4f1f9', ''],
    }[a.action];
    return `<li class="${a.undone_at ? 'undone' : ''}">
      <span class="ic" style="background:${map[2]}">${map[0]}</span>
      <div class="main"><div class="t">${esc(map[1])}${a.undone_at ? ' · בוטל' : ''}</div>
        <div class="d">${fmtDate(a.created_at)}${a.action !== 'edit' && a.balance_after != null ? ' · יתרה: ' + money(a.balance_after) : ''}</div></div>
      ${a.amount != null && a.action !== 'edit' ? `<div class="amt num">${map[3]}${money(a.amount)}</div>` : ''}
    </li>`;
  };
  openSheet(`<h3>${esc(v.company)} · ${esc(v.voucher_type)}</h3>
    <p class="lead">יתרה <span class="num">${money(v.balance)}</span> מתוך <span class="num">${money(v.initial_amount)}</span> · ${STATUS[statusOf(v)].label}</p>
    <form id="numForm" novalidate>
      <div class="field">
        <label for="numInp">מספר שובר <span class="hint">${v.voucher_number ? '' : '(חסר — אפשר להשלים)'}</span></label>
        <input class="input ltr num" id="numInp" value="${esc(v.voucher_number || '')}" inputmode="text" autocomplete="off" placeholder="לדוגמה 139381057-3719">
      </div>
      <button class="btn btn-soft btn-block" id="saveNum" type="submit">שמירת מספר</button>
    </form>
    <div class="section-title">היסטוריית פעולות</div>
    <ul class="hist">${acts.map(row).join('') || '<li>אין פעולות</li>'}</ul>
    <div class="divider"></div>
    <div class="sheet-actions" style="margin-top:0">
      <button class="btn btn-danger" id="delBtn">מחיקת השובר</button>
      <button class="btn btn-ghost" data-close>סגירה</button>
    </div>`);
  $('#numForm').onsubmit = e => {
    e.preventDefault();
    const val = $('#numInp').value.replace(/\s+/g, '');
    if (val === (v.voucher_number || '')) return toast('לא בוצע שינוי', 'bad');
    guarded($('#saveNum'), async () => {
      await rpc('voucher_set_number', { p_voucher_id: v.id, p_number: val || null });
      await load({ quiet: true });
      busy = false; closeSheet();
      toast(val ? 'מספר השובר נשמר' : 'מספר השובר הוסר');
    });
  };
  $('#delBtn').onclick = e => {
    const b = e.currentTarget;
    if (!b.dataset.sure) { b.dataset.sure = '1'; b.textContent = 'לחץ שוב לאישור מחיקה'; return; }
    guarded(b, async () => {
      await rpc('voucher_delete', { p_voucher_id: v.id });
      await load({ quiet: true });
      busy = false; closeSheet();
      toast('השובר נמחק');
    });
  };
}

/* הוספת שובר */
function openAdd() {
  const companies = [...new Set(['HTZ', 'BUYME', ...state.vouchers.map(v => v.company)])];
  let htzType = null;
  openSheet(`<h3>הוספת שובר</h3>
    <p class="lead">השובר יופיע ברשימה מיד אחרי השמירה.</p>
    <form id="addForm" novalidate>
      <div class="field">
        <label for="fCompany">שם החברה</label>
        <input class="input" id="fCompany" autocomplete="off" placeholder="לדוגמה HTZ">
        <div class="suggest">${companies.map(c => `<button type="button" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
      </div>
      <div class="field">
        <label for="fType">סוג השובר</label>
        <div id="typeHtz" class="seg" hidden>${HTZ_TYPES.map(t => `<button type="button" data-t="${t}">${t}</button>`).join('')}</div>
        <div id="typeFree">
          <input class="input" id="fType" autocomplete="off" list="typeList" placeholder="לדוגמה BUYME ALL">
          <datalist id="typeList"></datalist>
        </div>
        <div class="preview" id="typePrev"></div>
      </div>
      <div class="field">
        <label for="fNumber">מספר השובר <span class="hint">(אפשר להשאיר ריק)</span></label>
        <input class="input ltr num" id="fNumber" autocomplete="off" inputmode="text">
      </div>
      <div class="field">
        <label for="fAmount">סכום התחלתי</label>
        <div class="input-money"><input class="input num" id="fAmount" inputmode="decimal" autocomplete="off" placeholder="0"><span>₪</span></div>
        <div class="quick">${[100, 200, 250, 300, 500].map(n => `<button type="button" data-a="${n}">${n} ₪</button>`).join('')}</div>
      </div>
      <div class="err" id="addErr"></div>
      <div class="sheet-actions">
        <button class="btn btn-primary" id="saveAdd" type="submit">שמירת שובר</button>
        <button class="btn btn-ghost" type="button" data-close>ביטול</button>
      </div>
    </form>`);

  const comp = $('#fCompany'), typ = $('#fType');
  const syncType = () => {
    const isHtz = normCompany(comp.value) === 'HTZ';
    $('#typeHtz').hidden = !isHtz;
    $('#typeFree').hidden = isHtz;
    if (isHtz) {
      if (!htzType && typ.value) htzType = normType('HTZ', typ.value);   // EATZONE → EAT ZONE
      document.querySelectorAll('#typeHtz button').forEach(b => b.classList.toggle('on', b.dataset.t === htzType));
      $('#typePrev').textContent = '';
    } else {
      const known = [...new Set(state.vouchers.filter(v => v.company === normCompany(comp.value)).map(v => v.voucher_type))];
      $('#typeList').innerHTML = known.map(t => `<option value="${esc(t)}">`).join('');
      const n = normType(comp.value, typ.value);
      $('#typePrev').textContent = n && n !== typ.value.trim() ? `יישמר כ: ${n}` : '';
    }
  };
  comp.addEventListener('input', syncType);
  typ.addEventListener('input', syncType);
  $('#addForm .suggest').onclick = e => { const b = e.target.closest('button'); if (b) { comp.value = b.dataset.c; syncType(); } };
  $('#typeHtz').onclick = e => { const b = e.target.closest('button'); if (b) { htzType = b.dataset.t; syncType(); } };
  $('#addForm .quick').onclick = e => { const b = e.target.closest('button'); if (b) $('#fAmount').value = b.dataset.a; };
  syncType();

  $('#addForm').onsubmit = e => {
    e.preventDefault();
    const company = normCompany(comp.value);
    const type = company === 'HTZ' ? htzType : normType(company, typ.value);
    const number = $('#fNumber').value.replace(/\s+/g, '');
    const amount = parseAmount($('#fAmount').value);
    let err = '';
    if (!company) err = 'יש להזין שם חברה';
    else if (!type) err = company === 'HTZ' ? 'יש לבחור סוג שובר: EAT ZONE, CHEF ZONE או ALL IN ZONE' : 'יש להזין סוג שובר';
    else if (!(amount > 0)) err = 'יש להזין סכום התחלתי גדול מ-0';
    else if (number && state.vouchers.some(v => v.voucher_number === number)) err = `שובר מספר ${number} כבר קיים ברשימה`;
    $('#addErr').textContent = err;
    if (err) return;
    guarded($('#saveAdd'), async () => {
      await rpc('voucher_add', { p_company: company, p_type: type, p_number: number || null, p_amount: amount });
      state.fCompany = 'all'; state.fStatus = 'all';
      await load({ quiet: true });
      busy = false; closeSheet();
      toast(`השובר נוסף · ${company} ${type} · ${money(amount)}`);
    });
  };
}

/* ---------- events ---------- */
$('#sheet').addEventListener('click', e => { if (e.target.closest('[data-close]')) closeSheet(); });
$('#companyChips').onclick = e => { const b = e.target.closest('[data-company]'); if (b) { state.fCompany = b.dataset.company; render(); } };
$('#statusChips').onclick = e => { const b = e.target.closest('[data-status]'); if (b) { state.fStatus = b.dataset.status; render(); } };
$('#list').onclick = e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled || busy) return;
  const v = findV(b.closest('.card').dataset.id); if (!v) return;
  ({ full: openFull, partial: openPartial, undo: openUndo, more: openDetails })[b.dataset.act](v);
};
$('#addBtn').onclick = openAdd;
$('#refreshBtn').onclick = e => guarded(e.currentTarget, async () => { await load({ quiet: true }); toast('הנתונים עודכנו'); });
$('#logoutBtn').onclick = async () => { await sb.auth.signOut(); showLogin(); };
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state.loaded && !busy && !$('#sheet').classList.contains('open'))
    load({ quiet: true }).catch(() => {});
});

/* ---------- auth ---------- */
function showLogin() {
  state.loaded = false; state.vouchers = []; state.actions = [];
  $('#mainView').hidden = true; $('#loginView').hidden = false;
  $('#setupNote').hidden = configured;
  $('#loginBtn').disabled = !configured;
}
async function showMain() {
  $('#loginView').hidden = true; $('#mainView').hidden = false;
  try { await load(); }
  catch (e) {
    console.error(e);
    $('#list').innerHTML = `<div class="empty"><div class="big">⚠️</div>${esc(errMsg(e))}</div>`;
  }
}
$('#loginForm').onsubmit = e => {
  e.preventDefault();
  const email = $('#email').value.trim(), password = $('#password').value;
  if (!email || !password) { $('#loginErr').textContent = 'יש להזין אימייל וסיסמה'; return; }
  $('#loginErr').textContent = '';
  guarded($('#loginBtn'), async () => {
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      $('#loginErr').textContent = /invalid/i.test(error.message) ? 'אימייל או סיסמה שגויים' : error.message;
      return;
    }
    $('#password').value = '';
    await showMain();
  });
};

(async function init() {
  if (!configured) return showLogin();
  const { data } = await sb.auth.getSession();
  data.session ? showMain() : showLogin();
  sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') showLogin(); });
})();
</script>
</body>
</html>
