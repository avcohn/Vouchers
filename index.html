  --tint-100:#f8e0d7; --tint-150:#f5d5ca; --tint-200:#e6b3a9; --tint-300:#e3afa5; --tint-400:#cf948a;
  --tint-600:#9b4a3c; --tint-700:#5f3628; --tint-800:#45231a;
  --tab-on:#7a2213; --tab-line:#993827; --plus:#3e7a50;
  --peach:#fde6d6; --peach-ink:#2e1a14;
  --ok-bg:#f8e2d7; --ok-dot:#8c3522; --ok-ink:#3a1a15;
  --part-bg:#fcebd3; --part-dot:#cf7d2a; --part-ink:#6d3f12;
  --used-bg:#efe6e2; --used-dot:#b09a93; --used-ink:#6a5550;
  --rose-bg:#fbe3df; --rose-ink:#a1322c; --rose-solid:#b03a33;
  --radius:22px;
  --shadow:0 1px 2px rgba(95,54,40,.04),0 6px 20px rgba(95,54,40,.06);
  --safe-b:env(safe-area-inset-bottom,0px);
  --bottom-space:calc(126px + var(--safe-b));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:linear-gradient(180deg,#fef6f0,#fbefe7) var(--bg);color:var(--ink);font-family:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
body[data-tab=history]{--bottom-space:calc(70px + var(--safe-b))}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:default}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--tint-400);outline-offset:2px}
svg{display:block}
.money{display:inline-flex;align-items:baseline;gap:.14em;direction:ltr;unicode-bidi:isolate;white-space:nowrap;font-variant-numeric:tabular-nums}
.money .cur{font-size:.64em;font-weight:700}
.ltr{direction:ltr;unicode-bidi:isolate}

#app{max-width:560px;margin:0 auto;padding:4px 14px var(--bottom-space)}

/* ---------- header ---------- */
.top{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:6px 2px 10px}
.hello{justify-self:start;display:flex;align-items:center;gap:8px;min-width:0;color:var(--muted);font-size:14.5px;font-weight:500}
.hello span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{flex:none;width:34px;height:34px;border-radius:50%;background:#f7dcd3;display:grid;place-items:center}
.avatar svg{width:18px;height:18px;color:var(--ink-2)}
.top h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.5px;white-space:nowrap}
.round-btn{justify-self:end;width:40px;height:40px;border-radius:50%;background:#f7dbd2;display:grid;place-items:center;transition:background .15s}
.round-btn:active{background:var(--tint-200)}
.round-btn svg{width:20px;height:20px;color:var(--ink)}
.round-btn.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(-360deg)}}

.deco{position:absolute;pointer-events:none;user-select:none}
.d-hdr{width:30px;height:30px;left:46px;top:12px}
.d-tiny{width:17px;height:17px;right:-9px;top:44px}
.corner{position:absolute;width:56px;height:112px;pointer-events:none;user-select:none;z-index:0}
.corner.cl{left:-10px;bottom:calc(30px + var(--safe-b))}
.corner.cr{right:-12px;bottom:calc(6px + var(--safe-b))}
@media (min-width:600px){.corner{display:none}}

/* ---------- notices ---------- */
.notice{display:flex;align-items:center;gap:10px;border-radius:16px;padding:10px 14px;margin:0 0 12px;font-size:14px;line-height:1.4}
.notice svg{width:20px;height:20px;flex:none}
.notice.off{background:var(--rose-bg);color:var(--rose-ink)}
.notice.warn{background:var(--part-bg);color:var(--part-ink)}
.notice .grow{flex:1;min-width:0}
.notice button{font-weight:700;text-decoration:underline;min-height:32px;flex:none}

/* ---------- summary ---------- */
.summary{position:relative;overflow:hidden;background:linear-gradient(90deg,#f6d1c4 0%,#f9dcd1 48%,#fbe4db 100%);border-radius:22px;padding:13px 20px 11px;min-height:96px}
.summary .hero-art{position:absolute;left:0;top:50%;transform:translateY(-50%);width:min(250px,64%);height:auto;pointer-events:none;user-select:none}
.summary>*:not(.hero-art){position:relative}
.sum-lbl{font-size:16px;font-weight:600;color:var(--ink-2)}
.sum-total{font-size:40px;font-weight:800;line-height:1.05;letter-spacing:-1.2px;margin:1px 0 1px;min-height:42px}
.sum-total .money .cur{font-size:.6em;margin-inline-end:.08em}
.sum-sub{display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--ink-2);min-height:24px}
.delta{font-size:13.5px;font-weight:800;border-radius:99px;padding:1px 10px;background:rgba(255,255,255,.85);animation:pop .35s cubic-bezier(.2,.9,.3,1.3)}
.delta.up{color:var(--plus)} .delta.down{color:var(--rose-ink)}
.delta.fade{opacity:0;transition:opacity .5s}
@keyframes pop{from{transform:scale(.6);opacity:0}}

/* ---------- search + chips ---------- */
.search{position:relative;display:block;margin:10px 0 9px}
.search input{width:100%;height:42px;border-radius:999px;border:1.5px solid var(--line-2);background:var(--surface);padding:0 18px 0 48px;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--muted)}
.search input:focus{border-color:var(--tint-400);box-shadow:0 0 0 4px var(--tint-100)}
.search input::-webkit-search-cancel-button{display:none}
.search .s-ic{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--ink-2);pointer-events:none}
.search .s-clear{position:absolute;left:5px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2)}
.search .s-clear svg{width:16px;height:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 20px;border-radius:999px;background:var(--chip);border:1.5px solid transparent;font-weight:600;font-size:14.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s}
.chip.on{background:var(--tint-200);border-color:var(--tint-400);color:var(--tint-800)}
.chip.st{padding:0 12px;background:transparent;border-color:var(--line-2);color:var(--muted)}
.chip.st.on{background:var(--tint-200);border-color:var(--tint-400);color:var(--tint-800)}
.chip svg{width:15px;height:15px}
.results{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted);margin:0 4px 4px;min-height:32px}
.results button{color:var(--tint-700);font-weight:700;min-height:32px}

/* ---------- groups + cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:12px 14px 10px;margin-bottom:10px;cursor:pointer;transition:transform .12s,box-shadow .2s}
.card:active{transform:scale(.992)}
.card.flash{animation:flash 1.8s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--tint-400),var(--shadow)}100%{box-shadow:var(--shadow)}}
.card-main{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card-info{min-width:0;flex:1}
.title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:1px}
.badge{flex:none;background:var(--peach);color:var(--peach-ink);font-weight:800;font-size:12.5px;letter-spacing:.3px;border-radius:8px;padding:2px 8px;line-height:1.5}
.type{margin:0;font-size:19px;font-weight:800;line-height:1.25;letter-spacing:.2px;min-width:0;overflow-wrap:anywhere}
.type button{font:inherit;text-align:right}
.num-row{display:flex;align-items:center;gap:6px;margin-top:7px;min-height:28px;color:var(--muted);font-size:13.5px;text-align:right;max-width:100%;flex-wrap:wrap}
.num-row svg{width:16px;height:16px;color:var(--ink-2);flex:none}
.num-row .n{color:var(--ink-2);font-weight:500;font-size:14px;overflow-wrap:anywhere}
.num-row .add{color:var(--tint-700);font-weight:700}
.card-bal{flex:none;display:flex;flex-direction:column;align-items:flex-end}
.status{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.status i{width:7px;height:7px;border-radius:50%}
.st-active{background:var(--ok-bg);color:var(--ok-ink)} .st-active i{background:var(--ok-dot)}
.st-partial{background:var(--part-bg);color:var(--part-ink)} .st-partial i{background:var(--part-dot)}
.st-used{background:var(--used-bg);color:var(--used-ink)} .st-used i{background:var(--used-dot)}
.bal-lbl{font-size:13px;line-height:1.2;color:var(--muted);margin-top:5px}
.bal{font-size:31px;font-weight:800;line-height:1.02;letter-spacing:-.6px}
.of{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap}
.dash{border-top:1.5px dashed var(--line-2);margin:9px 0 9px}
.acts{display:flex;align-items:center;gap:8px}
.act{height:38px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:700;font-size:14.5px;white-space:nowrap;transition:transform .1s,opacity .15s;min-width:0}
.act:active:not(:disabled){transform:scale(.96)}
.act svg{width:18px;height:18px;flex:none}
.act-partial{flex:1.35 1 0;background:var(--tint-300);color:var(--tint-800)}
.act-full{flex:1 1 0;background:var(--surface);border:1.5px solid var(--line-2);color:var(--ink)}
.act-undo{flex:none;padding:0 4px;color:#944236;font-weight:600}
.act:disabled{opacity:.4}
.act-undo:disabled{opacity:1;color:#c9a39b}
.card.used{background:#fdf8f5}
.card.used .bal{color:var(--muted)}
.used-note{flex:1;font-size:13.5px;color:var(--muted)}
@media (max-width:374px){.top h1{font-size:21px}.hello{font-size:13px}.avatar{width:30px;height:30px}.act-undo .w2{display:none}.act{font-size:13.5px}.card{padding:11px 12px 9px}.bal{font-size:28px}.type{font-size:17.5px}}

/* ---------- empty / skeleton ---------- */
.empty{text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--radius);padding:34px 20px;margin-top:8px}
.empty .t{font-size:17px;font-weight:800;color:var(--ink);margin-bottom:4px}
.empty .btn{margin-top:14px}
.skel{height:168px;border-radius:var(--radius);margin-bottom:12px;background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sh 1.3s infinite;border:1px solid var(--line)}
@keyframes sh{to{background-position:-200% 0}}

/* ---------- history ---------- */
.mini-sum{display:flex;justify-content:space-between;align-items:center;background:var(--tint-100);border-radius:20px;padding:14px 18px;margin-bottom:12px}
.mini-sum .l{font-size:14px;color:var(--ink-2);font-weight:600}
.mini-sum .v{font-size:26px;font-weight:800;letter-spacing:-.5px}
.mini-sum .s{font-size:13px;color:var(--ink-2)}
.day{font-size:13.5px;font-weight:700;color:var(--muted);margin:16px 8px 8px}
.feed{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.feed-row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;text-align:right;border-bottom:1px solid var(--line);background:none;min-height:64px}
.feed-row:last-child{border-bottom:0}
button.feed-row:active{background:var(--surface-2)}
.feed-ic{flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center}
.feed-ic svg{width:20px;height:20px}
.ic-create{background:var(--tint-100);color:var(--tint-700)}
.ic-use{background:var(--peach);color:#8a3f1c}
.ic-undo{background:#e8efe1;color:var(--plus)}
.ic-edit{background:var(--surface-2);color:var(--ink-2)}
.ic-delete{background:var(--rose-bg);color:var(--rose-ink)}
.feed-main{flex:1;min-width:0;display:flex;flex-direction:column}
.feed-t{font-weight:700;font-size:15px}
.feed-s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.feed-time{font-size:12.5px;font-weight:500;color:var(--muted);margin-inline-start:8px}
.feed-end{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.feed-amt{font-weight:800;font-size:15px}
.feed-amt.plus{color:var(--plus)} .feed-amt.minus{color:var(--ink)} .feed-amt.del{color:var(--rose-ink)}
.feed-undo{font-size:12.5px;font-weight:700;color:var(--tint-700)}
.feed-row.undone .feed-t,.feed-row.undone .feed-amt{text-decoration:line-through;color:var(--muted-2)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:99px;padding:0 8px;background:var(--used-bg);color:var(--used-ink);margin-inline-start:6px;vertical-align:1px;text-decoration:none}

.used-sec{margin:0 0 12px}
.used-head{display:flex;align-items:center;gap:8px;width:100%;padding:6px 6px 8px;font-weight:800;font-size:15px;color:var(--ink-2)}
.used-head .cnt{background:var(--chip);color:var(--ink-2);border-radius:99px;padding:0 9px;font-size:13px;font-weight:700}
.used-head svg{width:18px;height:18px;margin-inline-start:auto;transition:transform .2s}
.used-head[aria-expanded=false] svg{transform:rotate(90deg)}
.used-list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.used-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.used-row:last-child{border-bottom:0}
.used-row:active{background:var(--surface-2)}
.u-main{flex:1;min-width:0}
.u-t{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.u-s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;margin-top:2px}
.u-undo{flex:none;height:34px;padding:0 12px;border-radius:12px;background:var(--tint-100);color:var(--tint-700);font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.u-undo svg{width:16px;height:16px}
.u-undo:disabled{opacity:.45}
.btn-wide{width:100%;margin-top:12px}

/* ---------- bottom bar ---------- */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 14px var(--safe-b);background:linear-gradient(to top,var(--bg) 78%,rgba(253,244,238,0));pointer-events:none}
.bottom-inner{position:relative;z-index:1;max-width:560px;margin:0 auto;pointer-events:auto}
.add-btn{width:100%;height:48px;border-radius:18px;background:var(--tint-700);color:#fff;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 8px 22px rgba(95,54,40,.3);transition:transform .1s,background .15s}
.add-btn:active:not(:disabled){transform:scale(.98);background:var(--tint-800)}
.add-btn:disabled{opacity:.55}
.add-btn .plus{width:26px;height:26px;border-radius:50%;background:#fff;display:grid;place-items:center}
.add-btn .plus svg{width:16px;height:16px;color:var(--tint-700)}
body[data-tab=history] .add-btn{display:none}
.tabs{display:flex;align-items:stretch;height:54px;margin-top:4px}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:9px;font-size:15.5px;font-weight:600;color:var(--muted);position:relative}
.tab svg{width:23px;height:23px}
.tab .tk{fill:none;stroke:currentColor}
.tab.on{color:var(--tab-on);font-weight:800}
.tab.on svg{color:var(--tint-700)}
.tab.on .tk{fill:currentColor}
.tab.on .perf{stroke:#f6dcd2}
.tab.on::after{content:"";position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:72px;height:3.5px;border-radius:4px;background:var(--tab-line)}
.tab-sep{width:1px;background:var(--line-2);margin:14px 0}

/* ---------- sheet ---------- */
.backdrop{position:fixed;inset:0;background:rgba(60,25,18,.3);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:90vh;max-height:90dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:28px 28px 0 0;padding:10px 18px calc(20px + var(--safe-b));z-index:41;transform:translateY(105%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s linear .3s;box-shadow:0 -12px 40px rgba(60,25,18,.16)}
.sheet.open{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line-2);margin:0 auto 14px}
.sheet h3{margin:0 0 4px;font-size:21px;font-weight:800;outline:none}
.sheet .lead{color:var(--muted);margin:0 0 16px;font-size:15px}
.field{margin-bottom:16px}
.label{display:block;font-weight:700;font-size:14.5px;margin-bottom:8px}
.label .opt{font-weight:400;color:var(--muted)}
.input{width:100%;height:52px;border-radius:16px;border:1.5px solid var(--line-2);background:#fff;padding:0 16px;font-size:17px;outline:none;transition:border-color .15s,box-shadow .15s}
.input:focus{border-color:var(--tint-400);box-shadow:0 0 0 4px var(--tint-100)}
.input[aria-invalid=true]{border-color:#d9928d}
.input.ltr{text-align:right}
.money-input{position:relative}
.money-input .input{padding-left:44px;font-size:22px;font-weight:700;height:58px}
.money-input span{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700;font-size:18px}
.err{color:var(--rose-ink);font-size:14px;margin-top:6px}
.err:empty{display:none}
.hint{font-size:13.5px;color:var(--muted);margin-top:6px}
.hint:empty{display:none}
.good{color:var(--tint-700);font-weight:600}
.pchips,.quick{display:flex;gap:8px;flex-wrap:wrap}
.quick{margin-top:10px}
.pchip,.quick button{height:40px;padding:0 16px;border-radius:999px;background:var(--chip);border:1.5px solid transparent;font-weight:700;font-size:14.5px}
.pchip.on{background:var(--tint-200);border-color:var(--tint-400);color:var(--tint-800)}
.pchips .input{margin-top:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{height:50px;border-radius:14px;border:1.5px solid var(--line-2);background:#fff;font-weight:800;font-size:13.5px;white-space:nowrap;padding:0 4px}
.seg button.on{background:var(--tint-200);border-color:var(--tint-400);color:var(--tint-800)}
.infobox{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface-2);border-radius:18px;padding:12px 14px;margin-bottom:16px}
.infobox .t{font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.infobox .s{font-size:13.5px;color:var(--muted)}
.infobox .r{text-align:left;flex:none}
.infobox .r .v{font-weight:800;font-size:19px}
.after{border-radius:14px;background:var(--tint-100);color:var(--tint-800);padding:10px 14px;font-size:14.5px;font-weight:600;margin:-4px 0 14px}
.after:empty{display:none}
.btn{height:54px;border-radius:18px;padding:0 18px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;position:relative;transition:transform .1s,opacity .15s;white-space:nowrap}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.45}
.btn svg{width:20px;height:20px}
.btn-primary{background:var(--tint-700);color:#fff}
.btn-soft{background:var(--tint-100);color:var(--tint-800)}
.btn-ghost{background:var(--surface-2);color:var(--ink)}
.btn-danger{background:var(--rose-bg);color:var(--rose-ink)}
.btn-danger-solid{background:var(--rose-solid);color:#fff}
.btn.loading{color:transparent!important}
.btn.loading svg{visibility:hidden}
.btn.loading::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;border:2.5px solid rgba(95,54,40,.25);border-top-color:var(--tint-700);animation:spin2 .7s linear infinite}
.btn-primary.loading::after,.btn-danger-solid.loading::after{border-color:rgba(255,255,255,.35);border-top-color:#fff}
@keyframes spin2{to{transform:rotate(360deg)}}
.sheet-actions{display:flex;gap:10px;margin-top:18px}
.sheet-actions .btn{flex:1;min-width:0}
.sheet-actions .btn:first-child{flex:1.4}
.pick{list-style:none;margin:0;padding:0}
.pick li{display:flex;align-items:center;gap:12px;border-radius:16px;border:2px solid transparent;background:var(--surface-2);padding:12px 14px;margin-bottom:8px;cursor:pointer;min-height:62px}
.pick li.sel{border-color:var(--tint-400);background:var(--tint-100)}
.pick .radio{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--muted-2);position:relative}
.pick li.sel .radio{border-color:var(--tint-700)}
.pick li.sel .radio::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--tint-700)}
.pick .main{flex:1;min-width:0}
.pick .t{font-weight:700}
.pick .d{font-size:13px;color:var(--muted)}
.pick .amt{font-weight:800}
.d-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.d-head h3{margin:0}
.d-bal{display:flex;justify-content:space-between;align-items:flex-end;background:var(--tint-100);border-radius:20px;padding:14px 16px;margin-bottom:16px}
.d-bal .v{font-size:32px;font-weight:800;line-height:1.1}
.d-bal .s{font-size:13.5px;color:var(--ink-2)}
.num-edit{display:flex;gap:8px}
.num-edit .input{flex:1;min-width:0}
.num-edit .btn{height:52px;flex:none}
.section-title{font-weight:800;font-size:15px;margin:20px 2px 8px}
.sheet .feed{box-shadow:none}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--bottom-space) - 4px);transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--tint-800);color:#fff;border-radius:16px;padding:12px 18px;font-weight:600;font-size:15px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.18);transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .3s;max-width:calc(100% - 28px);width:max-content;display:flex;gap:10px;align-items:center;line-height:1.4}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast.has-act.show{pointer-events:auto}
.toast-act{color:#ffd9cc;font-weight:800;text-decoration:underline;text-underline-offset:3px;min-height:32px;padding:0 4px;flex:none}
.toast.bad{background:#8f2f2a}
.toast svg{width:20px;height:20px;flex:none}

/* ---------- setup ---------- */
.setup{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.setup-card{max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:28px 22px;text-align:center}
.setup-card h1{margin:12px 0 6px;font-size:24px}
.setup-card p{color:var(--muted);margin:0}

@media (min-width:600px){#app{padding-top:20px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<script>
/* =====================================================================
   הגדרות
   ===================================================================== */
const API_URL   = 'https://script.google.com/macros/s/AKfycbxC7l842psK7_KSHPILNZyz7AkbUWIRH0B0zIwBUTMJamCC4hqMnzR49DMY8YAhM4VBDA/exec';
const USER_NAME = 'אבי';

/* ===================================================================== */
const API = (window.__VOUCHER_CFG && window.__VOUCHER_CFG.api) || API_URL;
const configured = /^https?:\/\//.test(API);
const CACHE_KEY = 'vouchers-cache:' + API;
const LABELS_KEY = 'vouchers-labels:' + API;
const HTZ_TYPES = ['EAT ZONE', 'CHEF ZONE', 'ALL IN ZONE'];
const STATUS = {
  active:  { label: 'פעיל',        cls: 'st-active'  },
  partial: { label: 'נוצל חלקית',  cls: 'st-partial' },
  used:    { label: 'נוצל במלואו', cls: 'st-used'    },
};
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const S = {
  vouchers: [], actions: [], loaded: false, synced: false, cachedAt: null, error: '', warnings: [], skipped: 0,
  tab: 'vouchers', company: 'all', q: '', hist: 'all', usedOpen: true, labels: {}, scroll: { vouchers: 0, history: 0 },
};
let busy = false;

/* ---------- עזרים ---------- */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = new Intl.NumberFormat('he-IL', { maximumFractionDigits: 2 });
const toCents = n => Math.round(Number(n) * 100);
const round2 = n => toCents(n) / 100;
const money = n => nf.format(round2(n)) + ' ₪';                                        // לטקסט רגיל
const moneyHTML = (n, sign = '') => `<span class="money">${sign}<span class="cur">₪</span><span>${nf.format(round2(Math.abs(n)))}</span></span>`;
const totalOf = list => list.reduce((s, v) => s + toCents(v.balance), 0) / 100;
const countLabel = n => n === 1 ? 'שובר אחד' : `${n} שוברים`;
const statusOf = v => v.balance <= 0 ? 'used' : v.balance >= v.initial_amount ? 'active' : 'partial';
const normCompany = s => String(s ?? '').trim().replace(/\s+/g, ' ').toUpperCase();
const numKey = s => String(s ?? '').replace(/[^0-9A-Za-z֐-׿]/g, '').toUpperCase();   // 139381057-3719 = 139381057 3719
const vibrate = p => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);
const hash = str => { let h = 5381; for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0; return h.toString(36); };
const findV = id => S.vouchers.find(v => v.id === id);

function normType(company, type) {
  const t = String(type ?? '').trim().replace(/\s+/g, ' ');
  if (normCompany(company) === 'HTZ') {
    const k = t.replace(/[^A-Za-z]/g, '').toUpperCase();
    if (k === 'EATZONE' || k === 'EAT') return 'EAT ZONE';
    if (k === 'CHEFZONE' || k === 'CHEF') return 'CHEF ZONE';
    if (k === 'ALLINZONE' || k === 'ALLIN') return 'ALL IN ZONE';
    return null;
  }
  return t ? t.toUpperCase() : null;
}

// "150", "150.5", "12,5", "1,000", "₪ 90" → מספר; כל השאר → NaN
function parseAmount(s) {
  let t = String(s ?? '').replace(/[₪\s]/g, '');
  if (/^\d{1,3}(,\d{3})+(\.\d{1,2})?$/.test(t)) t = t.replace(/,/g, '');
  else t = t.replace(',', '.');
  if (!/^\d+(\.\d{1,2})?$/.test(t)) return NaN;
  const n = Number(t);
  return n > 0 && n <= 1000000 ? round2(n) : NaN;
}

const dtTime = new Intl.DateTimeFormat('he-IL', { hour: '2-digit', minute: '2-digit' });
const dtDay = new Intl.DateTimeFormat('he-IL', { weekday: 'long', day: 'numeric', month: 'numeric' });
const dtFull = new Intl.DateTimeFormat('he-IL', { day: 'numeric', month: 'numeric', year: '2-digit', hour: '2-digit', minute: '2-digit' });
const asDate = s => { const d = new Date(s); return isNaN(d) ? null : d; };
const fmtTime = s => { const d = asDate(s); return d ? dtTime.format(d) : ''; };
const fmtFull = s => { const d = asDate(s); return d ? dtFull.format(d) : ''; };
const dtShort = new Intl.DateTimeFormat('he-IL', { day: 'numeric', month: 'numeric' });
const fmtDay = s => { const d = asDate(s); return d ? dtShort.format(d) : ''; };
function dayLabel(s) {
  const d = asDate(s); if (!d) return 'ללא תאריך';
  const start = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((start(new Date()) - start(d)) / 864e5);
  return diff === 0 ? 'היום' : diff === 1 ? 'אתמול' : dtDay.format(d);
}

const ICON = {

  filter: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16l-6 7.5V19l-4-2v-4.5z"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"/></svg>',
  ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 2.5 20h19z"/><path d="M12 10v4.5M12 17.2h.01"/></svg>',
  chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
  cloudOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M8.5 6.3A6 6 0 0 1 17.7 10h.3a3.5 3.5 0 0 1 2.3 6.2M17 19H7a4.5 4.5 0 0 1-1-8.9"/></svg>',
};

/* ---------- toast ---------- */
function toast(msg, kind = 'ok', action = null) {
  vibrate(kind === 'ok' ? 20 : [40, 60, 40]);
  const t = $('#toast');
  t.className = 'toast ' + kind + (action ? ' has-act' : '');
  t.innerHTML = (kind === 'ok' ? ICON.ok : ICON.alert) + '<span>' + esc(msg) + '</span>' + (action ? `<button type="button" class="toast-act">${esc(action.label)}</button>` : '');
  if (action) t.querySelector('.toast-act').onclick = () => { t.classList.remove('show'); action.run(); };
  requestAnimationFrame(() => t.classList.add('show'));
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove('show'), action ? 6500 : kind === 'ok' ? 2600 : 4200);
}

/* =====================================================================
   שרת: Google Sheets דרך Apps Script
   כל פעולה נשלחת עם מזהה בקשה. אם החיבור נפל באמצע, שולחים שוב עם אותו מזהה
   — השרת מזהה אותו ולא מבצע פעמיים.
   ===================================================================== */
class ApiError extends Error { constructor(msg, kind) { super(msg); this.kind = kind; } }
let pending = 0, sentSeq = 0, appliedSeq = 0, lastFetch = 0;

async function post(body) {
  if (navigator.onLine === false) throw new ApiError('אין חיבור לאינטרנט', 'net');
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 25000);
  try {
    let res;
    try { res = await fetch(API, { method: 'POST', body: JSON.stringify(body), signal: ctrl.signal }); }   // טקסט רגיל: בלי בדיקת CORS מקדימה
    catch (e) { throw new ApiError(e.name === 'AbortError' ? 'השרת לא הגיב בזמן' : 'אין חיבור לשרת', 'net'); }
    try { return await res.json(); }
    catch { throw new ApiError('התקבלה תשובה לא תקינה מהשרת', 'net'); }
  } finally { clearTimeout(timer); }
}

async function api(action, payload = {}, reqId = rid()) {
  const seq = ++sentSeq;
  pending++; syncIndicator();
  try {
    let data;
    for (let attempt = 0; ; attempt++) {
      try { data = await post({ action, reqId, ...payload }); break; }
      catch (e) { if (e.kind !== 'net' || attempt >= 2) throw e; await sleep(attempt ? 2200 : 800); }
    }
    lastFetch = Date.now();
    if (data && data.state && seq > appliedSeq) { appliedSeq = seq; applyState(data.state, { fromServer: true, warnings: data.warnings }); }
    if (!data || data.ok !== true) throw new ApiError((data && data.error) || 'הפעולה לא נשמרה', 'rejected');
    return data;
  } catch (e) {
    if (e.kind === 'net') { S.synced = false; S.error = e.message; renderNotices(); }
    throw e;
  } finally { pending--; syncIndicator(); }
}

// מזהה בקשה לכל חלון פעולה: אותו תוכן → אותו מזהה (לחיצה חוזרת אחרי תקלה בטוחה)
const newOp = () => { const base = rid(); return payload => base + '-' + hash(JSON.stringify(payload)); };

function syncIndicator() { $('#refreshBtn').classList.toggle('spin', pending > 0); }

/* ---------- נתונים ---------- */
// מקבל כל תשובה מהשרת בלי להפיל את כל המסך בגלל שורה אחת לא תקינה
function sanitize(raw) {
  const vouchers = [], ids = new Set(); let skipped = 0;
  (raw && Array.isArray(raw.vouchers) ? raw.vouchers : []).forEach((v, i) => {
    if (!v) { skipped++; return; }
    const id = String(v.id ?? '').trim();
    let init = Number(v.initial_amount), bal = Number(v.balance);
    if (v.balance == null || !Number.isFinite(bal) || bal < 0) bal = NaN;
    if (v.initial_amount == null || !Number.isFinite(init) || init <= 0) init = bal;
    if (!Number.isFinite(bal)) bal = init;
    if (!id || ids.has(id) || !(init > 0) || !Number.isFinite(bal)) { skipped++; return; }
    ids.add(id);
    vouchers.push({
      id,
      company: normCompany(v.company) || 'ללא חברה',
      voucher_type: String(v.voucher_type ?? '').trim() || 'ללא סוג',
      voucher_number: String(v.voucher_number ?? '').trim(),
      initial_amount: round2(init),
      balance: round2(bal),
      created_at: v.created_at || '',
      ord: Number.isFinite(Number(v.ord)) ? Number(v.ord) : i,
    });
  });
  const actions = (raw && Array.isArray(raw.actions) ? raw.actions : []).filter(a => a && a.id != null).map(a => ({
    id: String(a.id),
    voucher_id: String(a.voucher_id ?? ''),
    action: String(a.action || ''),
    amount: a.amount == null || a.amount === '' || !Number.isFinite(Number(a.amount)) ? null : round2(a.amount),
    is_full: a.is_full === true || a.is_full === 'true',
    balance_before: a.balance_before == null || a.balance_before === '' ? null : round2(a.balance_before),
    balance_after: a.balance_after == null || a.balance_after === '' ? null : round2(a.balance_after),
    undone_at: a.undone_at || null,
    note: String(a.note || ''),
    label: String(a.voucher_label || ''),
    created_at: a.created_at || '',
  }));
  return { vouchers, actions, skipped };
}

function applyState(raw, { fromServer = false, warnings = [], cachedAt = null } = {}) {
  const prevTotal = S.loaded ? totalOf(S.vouchers) : null;
  const { vouchers, actions, skipped } = sanitize(raw);
  S.vouchers = vouchers; S.actions = actions; S.skipped = skipped; S.loaded = true;
  if (fromServer) {
    S.synced = true; S.error = ''; S.cachedAt = new Date().toISOString();
    S.warnings = Array.isArray(warnings) ? warnings.map(String) : [];
    vouchers.forEach(v => { S.labels[v.id] = labelOf(v); });
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({ state: raw, at: S.cachedAt }));
      localStorage.setItem(LABELS_KEY, JSON.stringify(S.labels));
    } catch {}
  } else if (cachedAt) S.cachedAt = cachedAt;
  render();
  const next = totalOf(S.vouchers);
  if (prevTotal !== null && toCents(prevTotal) !== toCents(next)) animateTotal(prevTotal, next);
}

/* ---------- יתרה כוללת: תמיד מחושבת מכל השוברים, עם אנימציה ותווית שינוי ---------- */
let totalAnim = 0, animating = false;
function setTotal(n) { $('#sumTotal').innerHTML = moneyHTML(n); }
function animateTotal(from, to) {
  cancelAnimationFrame(totalAnim);
  const d = $('#sumDelta'), diff = round2(to - from);
  d.hidden = false; d.className = 'delta ' + (diff > 0 ? 'up' : 'down');
  d.innerHTML = moneyHTML(diff, diff > 0 ? '+' : '−');
  clearTimeout(animateTotal.t1); clearTimeout(animateTotal.t2);
  animateTotal.t1 = setTimeout(() => d.classList.add('fade'), 2400);
  animateTotal.t2 = setTimeout(() => { d.hidden = true; }, 2950);
  if (reduceMotion) { setTotal(to); return; }
  animating = true;
  const t0 = performance.now(), dur = 700;
  const step = t => {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    setTotal(k < 1 ? Math.round(from + (to - from) * e) : to);
    if (k < 1) totalAnim = requestAnimationFrame(step); else animating = false;
  };
  setTotal(from);
  totalAnim = requestAnimationFrame(step);
}

/* =====================================================================
   תצוגה
   ===================================================================== */
const companiesOf = list => [...new Set(list.map(v => v.company))].sort((a, b) => {
  const o = c => c === 'HTZ' ? 0 : c === 'BUYME' ? 1 : 2;
  return o(a) - o(b) || a.localeCompare(b, 'he');
});
const labelOf = v => `${v.company} · ${v.voucher_type}${v.voucher_number ? ' · ' + v.voucher_number : ''}`;
const shortLabel = l => String(l).replace(/[0-9A-Za-z-]{6,}$/, m => m.slice(-4));   // HTZ · EAT ZONE · 139381057-3719 → …3719
const isActive = v => v.balance > 0;               // בעמוד הראשי: רק שוברים שנשארה בהם יתרה
const undoableOf = id => S.actions.filter(a => a.voucher_id === id && a.action === 'use' && !a.undone_at);

function matches(v) {
  if (S.company !== 'all' && v.company !== S.company) return false;
  if (S.q) {
    const q = S.q.toLowerCase(), qk = numKey(S.q);
    const text = `${v.company} ${v.voucher_type}`.toLowerCase();
    if (!text.includes(q) && !(qk && numKey(v.voucher_number).includes(qk))) return false;
  }
  return true;
}

function render() {
  document.body.dataset.tab = S.tab;
  $('#pageTitle').textContent = S.tab === 'history' ? 'היסטוריה' : 'השוברים שלי';
  $$('.tab').forEach(t => { const on = t.dataset.tab === S.tab; t.classList.toggle('on', on); t.setAttribute('aria-selected', String(on)); });
  $('#vouchersView').hidden = S.tab !== 'vouchers';
  $('#historyView').hidden = S.tab !== 'history';
  $('#addBtn').disabled = !S.loaded || busy;
  renderNotices();
  if (S.tab === 'vouchers') renderVouchers(); else renderHistory();
}

function renderNotices() {
  const out = [];
  if (S.loaded && !S.synced && S.error) {
    const when = S.cachedAt ? ` · מוצגים נתונים מ-${fmtFull(S.cachedAt)}` : '';
    out.push(`<div class="notice off">${ICON.cloudOff}<span class="grow">${esc(S.error)}${esc(when)}</span><button type="button" data-retry>נסה שוב</button></div>`);
  }
  if (S.warnings.length) {
    const more = S.warnings.length > 1 ? ` (ועוד ${S.warnings.length - 1})` : '';
    out.push(`<div class="notice warn">${ICON.alert}<span class="grow">${esc(S.warnings[0])}${esc(more)}</span></div>`);
  }
  if (S.skipped) out.push(`<div class="notice warn">${ICON.alert}<span class="grow">${S.skipped} שורות בגיליון לא הוצגו כי חסרים בהן נתונים</span></div>`);
  $('#notices').innerHTML = out.join('');
}

function renderVouchers() {
  const active = S.vouchers.filter(isActive);
  // סיכום — כל השוברים (שובר שנוצל במלואו ממילא לא מוסיף ליתרה), בלי קשר לחיפוש
  if (!animating) { if (S.loaded) setTotal(totalOf(S.vouchers)); else $('#sumTotal').textContent = '—'; }
  $('#sumCount').textContent = S.loaded ? countLabel(active.length) : 'טוען…';

  const companies = companiesOf(active);
  if (S.company !== 'all' && !companies.includes(S.company)) S.company = 'all';
  $('#chips').innerHTML = [['all', 'הכול'], ...companies.map(c => [c, c])].map(([k, l]) =>
    `<button type="button" class="chip ${S.company === k ? 'on' : ''}" aria-pressed="${S.company === k}" data-company="${esc(k)}">${esc(l)}</button>`).join('');
  $('#searchClear').hidden = !S.q;

  if (!S.loaded) { $('#list').innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>'; $('#results').hidden = true; return; }

  const shown = active.filter(matches);
  const filtered = S.company !== 'all' || !!S.q;
  $('#results').hidden = !filtered;
  if (filtered) $('#results').innerHTML = `<span>${shown.length ? `${countLabel(shown.length)} · יתרה ${moneyHTML(totalOf(shown))}` : 'אין תוצאות'}</span><button type="button" data-clear>ניקוי סינון</button>`;

  const usedCount = S.vouchers.length - active.length;
  if (!active.length) {
    $('#list').innerHTML = S.vouchers.length
      ? `<div class="empty"><div class="t">כל השוברים נוצלו</div>${usedCount === 1 ? 'השובר שנוצל נמצא' : 'השוברים שנוצלו נמצאים'} בלשונית ההיסטוריה.<br><button type="button" class="btn btn-soft" data-add>${ICON.plus}הוספת שובר</button></div>`
      : `<div class="empty"><div class="t">אין עדיין שוברים</div>אפשר להוסיף שובר ראשון עכשיו.<br><button type="button" class="btn btn-soft" data-add>${ICON.plus}הוספת שובר</button></div>`;
    return;
  }
  if (!shown.length) {
    const usedHits = S.q ? S.vouchers.filter(v => !isActive(v) && matches(v)).length : 0;
    $('#list').innerHTML = `<div class="empty"><div class="t">לא נמצאו שוברים</div>${usedHits
      ? `${usedHits === 1 ? 'יש שובר שנוצל שמתאים לחיפוש' : `יש ${usedHits} שוברים שנוצלו שמתאימים לחיפוש`}.<br><button type="button" class="btn btn-soft" data-goused>הצגה בהיסטוריה</button>`
      : `אין שוברים פעילים שמתאימים לחיפוש.<br><button type="button" class="btn btn-soft" data-clear>ניקוי סינון</button>`}</div>`;
    return;
  }
  $('#list').innerHTML = companies.map(c => {
    const items = shown.filter(v => v.company === c).sort((a, b) => a.ord - b.ord);       // סדר קבוע — כרטיס לא קופץ אחרי ניצול
    if (!items.length) return '';
    return `<section aria-label="${esc(c)}">${items.map(cardHTML).join('')}</section>`;
  }).join('');
}

function cardHTML(v) {
  const st = statusOf(v), used = st === 'used';
  const canUndo = undoableOf(v.id).length > 0;
  const lastUse = used ? undoableOf(v.id).slice(-1)[0] : null;
  const num = v.voucher_number
    ? `<button type="button" class="num-row" data-act="copy" aria-label="העתקת מספר השובר ${esc(v.voucher_number)}">${ICON.copy}<span>מס׳ שובר</span><span class="n ltr">${esc(v.voucher_number)}</span></button>`
    : `<button type="button" class="num-row" data-act="addnum">${ICON.copy}<span>מס׳ שובר</span><span>ללא מספר ·</span><span class="add">הוספה</span></button>`;
  const undoBtn = `<button type="button" class="act act-undo" data-act="undo" aria-label="ביטול ניצול" ${canUndo ? '' : 'disabled'}><span>ביטול<span class="w2"> ניצול</span></span>${ICON.undo}</button>`;
  const actions = used
    ? `<span class="used-note">${lastUse ? 'נוצל ב-' + esc(fmtFull(lastUse.created_at).split(',')[0] || '') : 'נוצל במלואו'}</span>${undoBtn}`
    : `<button type="button" class="act act-partial" data-act="partial"><span>נוצל חלקית</span>${ICON.pie}</button>
       <button type="button" class="act act-full" data-act="full"><span>נוצל</span>${ICON.check}</button>
       ${undoBtn}`;
  return `<article class="card ${used ? 'used' : ''}" data-id="${esc(v.id)}">
    <div class="card-main">
      <div class="card-info">
        <div class="title-row"><span class="badge">${esc(v.company)}</span><h3 class="type"><button type="button" data-act="details">${esc(v.voucher_type)}</button></h3></div>
        ${num}
      </div>
      <div class="card-bal">
        <span class="status ${STATUS[st].cls}"><span>${STATUS[st].label}</span><i></i></span>
        <span class="bal-lbl">יתרה</span>
        <span class="bal">${moneyHTML(v.balance)}</span>
        ${st !== 'active' ? `<span class="of">מתוך ${moneyHTML(v.initial_amount)}</span>` : ''}
      </div>
    </div>
    <div class="dash"></div>
    <div class="acts">${actions}</div>
  </article>`;
}

/* ---------- היסטוריה ---------- */
function actionView(a) {
  const v = findV(a.voucher_id);
  const label = shortLabel(v ? labelOf(v) : (a.label || S.labels[a.voucher_id] || 'שובר שנמחק'));
  const fromSheet = a.note === 'נוסף ישירות בגיליון';
  const map = {
    create: { ic: ICON.plus,   cls: 'ic-create', t: fromSheet ? 'נוסף בגיליון' : 'שובר נוסף', amt: a.amount, sign: '+', amtCls: 'plus' },
    use:    { ic: a.is_full ? ICON.check : ICON.pie, cls: 'ic-use', t: a.is_full ? 'ניצול מלא' : 'ניצול חלקי', amt: a.amount, sign: '−', amtCls: 'minus' },
    undo:   { ic: ICON.undo,   cls: 'ic-undo',   t: 'ביטול ניצול', amt: a.amount, sign: '+', amtCls: 'plus' },
    edit:   { ic: ICON.pencil, cls: 'ic-edit',   t: 'מספר שובר עודכן', amt: null },
    delete: { ic: ICON.trash,  cls: 'ic-delete', t: 'שובר נמחק', amt: a.balance_before, sign: '−', amtCls: 'del' },
  }[a.action] || { ic: ICON.pencil, cls: 'ic-edit', t: a.note || 'פעולה', amt: null };
  const canUndo = a.action === 'use' && !a.undone_at && !!v;
  return { v, label, canUndo, ...map };
}

function feedRow(a, { showLabel = true, allowOpen = true } = {}) {
  const x = actionView(a);
  const clickable = x.canUndo || (allowOpen && x.v);
  const tag = clickable ? 'button' : 'div';
  const amt = x.amt != null && x.amt > 0 ? `<span class="feed-amt ${x.amtCls}">${moneyHTML(x.amt, x.sign)}</span>` : '';
  const when = showLabel ? fmtTime(a.created_at) : fmtFull(a.created_at);
  const sub = [showLabel ? x.label : '', a.action === 'edit' ? a.note.replace(/^מספר שובר:\s*/, '') : ''].filter(Boolean).join(' · ');
  return `<${tag} ${clickable ? 'type="button"' : ''} class="feed-row ${a.undone_at ? 'undone' : ''}" data-aid="${esc(a.id)}">
    <span class="feed-ic ${x.cls}">${x.ic}</span>
    <span class="feed-main"><span class="feed-t">${esc(x.t)}${a.undone_at ? '<span class="tag">בוטל</span>' : ''}<span class="feed-time">${esc(when)}</span></span>${sub ? `<span class="feed-s" dir="auto">${esc(sub)}</span>` : ''}</span>
    <span class="feed-end">${amt}${x.canUndo ? '<span class="feed-undo">ביטול</span>' : ''}</span>
  </${tag}>`;
}

function sortedActions(list) {
  return list.slice().sort((a, b) => (String(b.created_at).localeCompare(String(a.created_at))) || (Number(b.id) - Number(a.id)));
}

function renderHistory() {
  const now = new Date();
  const monthUses = S.actions.filter(a => a.action === 'use' && !a.undone_at && (d => d && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear())(asDate(a.created_at)));
  $('#histSum').innerHTML = S.loaded
    ? `<div class="mini-sum"><div><div class="l">נוצל החודש</div><div class="s">${monthUses.length === 1 ? 'ניצול אחד' : monthUses.length + ' ניצולים'}</div></div><div class="v">${moneyHTML(monthUses.reduce((s, a) => s + toCents(a.amount), 0) / 100)}</div></div>`
    : '';
  const used = S.vouchers.filter(v => !isActive(v)).map(v => ({ v, last: undoableOf(v.id).slice(-1)[0] }))
    .sort((a, b) => String(b.last ? b.last.created_at : '').localeCompare(String(a.last ? a.last.created_at : '')));
  $('#usedSec').innerHTML = S.loaded && used.length ? `<section class="used-sec" id="usedAnchor">
      <button type="button" class="used-head" data-toggle-used aria-expanded="${S.usedOpen}"><span>שוברים שנוצלו</span><span class="cnt">${used.length}</span>${ICON.chev}</button>
      <div class="used-list" ${S.usedOpen ? '' : 'hidden'}>${used.map(({ v, last }) => `<div class="used-row" data-id="${esc(v.id)}">
        <div class="u-main"><div class="u-t"><span class="badge">${esc(v.company)}</span><span>${esc(v.voucher_type)}</span></div>
        <div class="u-s" dir="auto">${esc([v.voucher_number, last ? 'נוצל ' + fmtDay(last.created_at) : 'נוצל', money(v.initial_amount)].filter(Boolean).join(' · '))}</div></div>
        <button type="button" class="u-undo" data-uundo ${last ? '' : 'disabled'}><span>ביטול ניצול</span>${ICON.undo}</button></div>`).join('')}</div></section>` : '';
  const kinds = [['all', 'הכול'], ['use', 'ניצולים'], ['undo', 'ביטולים'], ['other', 'שינויים']];
  $('#histChips').innerHTML = kinds.map(([k, l]) => `<button type="button" class="chip ${S.hist === k ? 'on' : ''}" aria-pressed="${S.hist === k}" data-hist="${k}">${l}</button>`).join('');
  if (!S.loaded) { $('#histList').innerHTML = '<div class="skel"></div><div class="skel"></div>'; return; }
  const list = sortedActions(S.actions.filter(a => S.hist === 'all' || (S.hist === 'other' ? !['use', 'undo'].includes(a.action) : a.action === S.hist)));
  if (!list.length) { $('#histList').innerHTML = '<div class="empty"><div class="t">אין פעולות להצגה</div>כל ניצול, ביטול והוספה יופיעו כאן.</div>'; return; }
  const days = [];
  list.forEach(a => { const d = dayLabel(a.created_at); if (!days.length || days[days.length - 1].d !== d) days.push({ d, items: [] }); days[days.length - 1].items.push(a); });
  $('#histList').innerHTML = days.map(g => `<div class="day">${esc(g.d)}</div><div class="feed">${g.items.map(a => feedRow(a)).join('')}</div>`).join('');
}

/* =====================================================================
   חלונות (bottom sheet)
   ===================================================================== */
let sheetOpen = false, ignorePop = false, needPush = false, returnFocus = null;
const pushSheet = () => { try { history.pushState({ vsheet: 1 }, ''); } catch {} };
function openSheet(html, focusSel) {
  $('#sheetBody').innerHTML = html;
  const title = $('#sheetBody h3'); if (title) { title.id = 'sheetTitle'; title.tabIndex = -1; }
  if (!sheetOpen) {
    sheetOpen = true; returnFocus = document.activeElement;
    if (ignorePop) needPush = true; else pushSheet();
    $('#backdrop').classList.add('open'); $('#sheet').classList.add('open');
    $('#app').inert = true; $('#bottom').inert = true; document.body.style.overflow = 'hidden';
  }
  $('#sheet').scrollTop = 0;
  setTimeout(() => { const f = focusSel && $(focusSel); (f || title || $('#sheet')).focus({ preventScroll: true }); }, focusSel ? 320 : 60);
}
function closeSheet({ force = false, fromPop = false } = {}) {
  if (!sheetOpen || (busy && !force && !fromPop)) return;
  sheetOpen = false;
  $('#backdrop').classList.remove('open'); $('#sheet').classList.remove('open');
  $('#app').inert = false; $('#bottom').inert = false; document.body.style.overflow = '';
  if (!fromPop && history.state && history.state.vsheet) { ignorePop = true; history.back(); }
  if (returnFocus && returnFocus.isConnected) returnFocus.focus({ preventScroll: true });
}
window.addEventListener('popstate', () => {
  if (ignorePop) { ignorePop = false; if (needPush && sheetOpen) { needPush = false; pushSheet(); } return; }
  if (sheetOpen) closeSheet({ fromPop: true });
});
$('#backdrop').addEventListener('click', () => closeSheet());
$('#sheet').addEventListener('click', e => { if (e.target.closest('[data-close]')) closeSheet(); });
document.addEventListener('keydown', e => {
  if (!sheetOpen) return;
  if (e.key === 'Escape') { e.preventDefault(); closeSheet(); return; }
  if (e.key !== 'Tab') return;
  const items = $$('#sheet button:not(:disabled), #sheet input:not(:disabled), #sheet [tabindex="0"]').filter(el => el.getClientRects().length);
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1];
  if (e.shiftKey && (document.activeElement === first || !items.includes(document.activeElement))) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && (document.activeElement === last || !items.includes(document.activeElement))) { e.preventDefault(); first.focus(); }
});

// מונע לחיצה כפולה: בזמן שמירה כל החלון נעול והכפתור מסתובב
async function guarded(btn, fn) {
  if (busy) return;
  busy = true;
  const controls = $$('#sheet button, #sheet input').map(el => [el, el.disabled]);
  controls.forEach(([el]) => { el.disabled = true; });
  if (btn) btn.classList.add('loading');
  try { await fn(); }
  catch (e) {
    console.warn(e);
    toast(e.kind === 'net' ? `${e.message}. אפשר ללחוץ שוב — הפעולה לא תירשם פעמיים.` : (e.message || 'משהו השתבש'), 'bad');
  } finally {
    busy = false;
    if (btn) btn.classList.remove('loading');
    controls.forEach(([el, was]) => { if (el.isConnected) el.disabled = was; });
    $('#addBtn').disabled = !S.loaded;
  }
}
function finish(msg) { closeSheet({ force: true }); toast(msg); }
// שובר שנוצל במלואו יוצא מהעמוד הראשי — עם אפשרות לבטל מיד מההודעה
function finishUsed(v) {
  const last = undoableOf(v.id).slice(-1)[0];
  closeSheet({ force: true });
  toast('השובר נוצל במלואו ועבר להיסטוריה', 'ok', last ? { label: 'ביטול', run: () => quickUndo(last.id, v.id) } : null);
}
async function quickUndo(aid, vid) {
  if (busy) return;
  busy = true; $('#addBtn').disabled = true;
  try {
    await api('undo', { actionId: aid }, 'undo-' + aid);
    toast('הניצול בוטל · השובר חזר לרשימה');
    if (S.tab === 'vouchers') highlight(vid);
  } catch (e) { toast(e.message || 'הביטול נכשל', 'bad'); }
  finally { busy = false; $('#addBtn').disabled = !S.loaded; }
}

const infoBox = v => `<div class="infobox">
  <div><div class="t"><span class="badge">${esc(v.company)}</span>${esc(v.voucher_type)}</div>
  <div class="s">${v.voucher_number ? 'מס׳ שובר <span class="ltr">' + esc(v.voucher_number) + '</span>' : 'ללא מספר שובר'}</div></div>
  <div class="r"><div class="s">יתרה</div><div class="v">${moneyHTML(v.balance)}</div></div></div>`;

/* ---------- נוצל (במלואו) ---------- */
function openFull(v) {
  const op = newOp();
  openSheet(`<h3>לסמן שהשובר נוצל?</h3>
    <p class="lead">היתרה תתאפס והשובר יעבור ל״נוצל במלואו״. אפשר לבטל אחר כך.</p>
    ${infoBox(v)}
    <div class="sheet-actions"><button type="button" class="btn btn-primary" id="goFull">כן, נוצל · ${moneyHTML(v.balance)}</button><button type="button" class="btn btn-ghost" data-close>ביטול</button></div>`);
  $('#goFull').onclick = e => guarded(e.currentTarget, async () => {
    const p = { voucherId: v.id, full: true };
    await api('use', p, op(p));
    finishUsed(v);
  });
}

/* ---------- נוצל חלקית ---------- */
function openPartial(v) {
  const op = newOp(), max = v.balance;
  const quick = [20, 50, 100, 200].filter(n => n < max);
  openSheet(`<h3>ניצול חלקי</h3>
    <p class="lead">כמה נוצל מהשובר?</p>
    ${infoBox(v)}
    <form id="partialForm" novalidate autocomplete="off">
      <div class="field">
        <label class="label" for="useAmt">סכום שנוצל</label>
        <div class="money-input"><input class="input" id="useAmt" inputmode="decimal" placeholder="0" aria-describedby="useErr usePrev"><span>₪</span></div>
        <div class="quick">${quick.map(n => `<button type="button" data-a="${n}">${n} ₪</button>`).join('')}<button type="button" data-a="${max}">כל היתרה</button></div>
        <div class="err" id="useErr"></div>
        <div class="hint" id="usePrev"></div>
      </div>
      <div class="sheet-actions"><button type="submit" class="btn btn-primary" id="savePartial" disabled>עדכון יתרה</button><button type="button" class="btn btn-ghost" data-close>ביטול</button></div>
    </form>`, '#useAmt');
  const inp = $('#useAmt'), btn = $('#savePartial');
  const check = () => {
    const raw = inp.value.trim(), a = parseAmount(raw);
    let err = '';
    if (raw && !(a > 0)) err = 'יש להזין סכום תקין';
    else if (a > max) err = `הסכום גבוה מהיתרה (${money(max)})`;
    $('#useErr').textContent = err;
    inp.setAttribute('aria-invalid', String(!!err));
    const ok = !err && a > 0;
    $('#usePrev').innerHTML = ok ? `יתרה אחרי העדכון: <b>${moneyHTML(max - a)}</b>${a === max ? ' · השובר יסומן כנוצל במלואו' : ''}` : '';
    if (!busy) btn.disabled = !ok;
    return ok;
  };
  inp.addEventListener('input', check);
  $('#partialForm .quick').onclick = e => { const b = e.target.closest('[data-a]'); if (b) { inp.value = b.dataset.a; check(); inp.focus(); } };
  $('#partialForm').onsubmit = e => {
    e.preventDefault();
    if (busy || !check()) return;
    const a = parseAmount(inp.value);
    guarded(btn, async () => {
      const p = { voucherId: v.id, amount: a };
      await api('use', p, op(p));
      const nv = findV(v.id);
      if (nv && !isActive(nv)) return finishUsed(v);
      finish(`נוצלו ${money(a)} · נותרו ${money(nv ? nv.balance : max - a)}`);
    });
  };
}

/* ---------- ביטול ניצול ---------- */
function openUndo(v) {
  const list = undoableOf(v.id).slice().reverse();
  if (!list.length) return toast('אין ניצולים לביטול בשובר הזה', 'bad');
  const op = newOp();
  let sel = list[0].id;
  openSheet(`<h3>ביטול ניצול</h3>
    <p class="lead">${list.length > 1 ? 'בחר איזה ניצול לבטל — הסכום יחזור ליתרה.' : 'הסכום יחזור ליתרת השובר.'}</p>
    ${infoBox(v)}
    <ul class="pick" id="undoList" role="radiogroup" aria-label="ניצול לביטול">
      ${list.map(a => `<li role="radio" tabindex="0" data-aid="${esc(a.id)}"><span class="radio"></span>
        <div class="main"><div class="t">${a.is_full ? 'ניצול מלא' : 'ניצול חלקי'}</div><div class="d">${esc(fmtFull(a.created_at))}</div></div>
        <div class="amt">${moneyHTML(a.amount)}</div></li>`).join('')}
    </ul>
    <div class="sheet-actions"><button type="button" class="btn btn-primary" id="goUndo"></button><button type="button" class="btn btn-ghost" data-close>סגירה</button></div>`);
  const upd = () => {
    const a = list.find(x => x.id === sel);
    $('#goUndo').innerHTML = `החזרת ${moneyHTML(a.amount)} ליתרה`;
    $$('#undoList li').forEach(li => { const on = li.dataset.aid === sel; li.classList.toggle('sel', on); li.setAttribute('aria-checked', String(on)); });
  };
  const pick = li => { if (li && !busy) { sel = li.dataset.aid; vibrate(10); upd(); } };
  $('#undoList').onclick = e => pick(e.target.closest('li'));
  $('#undoList').onkeydown = e => {
    const items = $$('#undoList li'), i = items.indexOf(e.target.closest('li'));
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); pick(items[i]); }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const n = items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length]; n.focus(); pick(n); }
  };
  upd();
  $('#goUndo').onclick = e => guarded(e.currentTarget, async () => {
    const a = list.find(x => x.id === sel), p = { actionId: a.id };
    await api('undo', p, op(p));
    const nv = findV(v.id);
    finish(`הניצול בוטל · ${money(a.amount)} חזרו ליתרה${nv ? ' (' + STATUS[statusOf(nv)].label + ')' : ''}`);
  });
}

// ביטול ניצול מסוים (מלשונית ההיסטוריה)
function openUndoOne(a) {
  const v = findV(a.voucher_id); if (!v) return;
  const op = newOp();
  openSheet(`<h3>לבטל את הניצול?</h3>
    <p class="lead">${a.is_full ? 'ניצול מלא' : 'ניצול חלקי'} מ-${esc(fmtFull(a.created_at))}. הסכום יחזור ליתרת השובר.</p>
    ${infoBox(v)}
    <div class="sheet-actions"><button type="button" class="btn btn-primary" id="goUndoOne">החזרת ${moneyHTML(a.amount)} ליתרה</button><button type="button" class="btn btn-ghost" data-close>סגירה</button></div>`);
  $('#goUndoOne').onclick = e => guarded(e.currentTarget, async () => {
    const p = { actionId: a.id };
    await api('undo', p, op(p));
    finish(`הניצול בוטל · ${money(a.amount)} חזרו ליתרה`);
  });
}

/* ---------- פרטים: מספר שובר, היסטוריה, מחיקה ---------- */
function openDetails(v, focusNumber = false) {
  const st = statusOf(v);
  const acts = sortedActions(S.actions.filter(a => a.voucher_id === v.id));
  const op = newOp();
  openSheet(`<div class="d-head"><span class="badge">${esc(v.company)}</span><h3>${esc(v.voucher_type)}</h3></div>
    <div class="d-bal"><div><div class="s">יתרה</div><div class="v">${moneyHTML(v.balance)}</div><div class="s">מתוך ${moneyHTML(v.initial_amount)}</div></div>
      <span class="status ${STATUS[st].cls}"><span>${STATUS[st].label}</span><i></i></span></div>
    <form id="numForm" novalidate autocomplete="off">
      <label class="label" for="numInp">מספר שובר ${v.voucher_number ? '' : '<span class="opt">(חסר — אפשר להשלים)</span>'}</label>
      <div class="num-edit"><input class="input ltr" id="numInp" value="${esc(v.voucher_number)}" placeholder="לדוגמה 139381057-3719" inputmode="text"><button type="submit" class="btn btn-soft" id="saveNum">שמירה</button></div>
      <div class="err" id="numErr"></div>
    </form>
    ${undoableOf(v.id).length ? `<button type="button" class="btn btn-soft btn-wide" id="dUndo">${ICON.undo}ביטול ניצול</button>` : ''}
    <div class="section-title">היסטוריית השובר</div>
    <div class="feed">${acts.map(a => feedRow(a, { showLabel: false, allowOpen: false })).join('') || '<div class="feed-row"><span class="feed-main">אין פעולות</span></div>'}</div>
    <div class="sheet-actions"><button type="button" class="btn btn-danger" id="delBtn">${ICON.trash}מחיקת השובר</button><button type="button" class="btn btn-ghost" data-close>סגירה</button></div>`, focusNumber ? '#numInp' : null);

  $('#sheetBody .feed').onclick = e => { const r = e.target.closest('button.feed-row'); if (r) { const a = S.actions.find(x => x.id === r.dataset.aid); if (a) openUndoOne(a); } };
  $('#numForm').onsubmit = e => {
    e.preventDefault();
    if (busy) return;
    const val = $('#numInp').value.replace(/\s+/g, '');
    const dup = numKey(val) && S.vouchers.find(x => x.id !== v.id && numKey(x.voucher_number) === numKey(val));
    $('#numErr').textContent = dup ? `המספר כבר קיים: ${labelOf(dup)}` : '';
    if (dup) return;
    if (val === v.voucher_number) return closeSheet();
    guarded($('#saveNum'), async () => {
      const p = { voucherId: v.id, number: val };
      await api('setNumber', p, op(p));
      finish(val ? 'מספר השובר נשמר' : 'מספר השובר הוסר');
    });
  };
  $('#delBtn').onclick = () => { if (!busy) openDelete(v); };
  if ($('#dUndo')) $('#dUndo').onclick = () => { if (!busy) openUndo(v); };
}

function openDelete(v) {
  const op = newOp();
  const total = totalOf(S.vouchers), after = round2(total - v.balance);
  const effect = v.balance > 0
    ? `היתרה הכוללת תרד ב-${money(v.balance)} ותהיה ${money(after)}.`
    : 'לשובר אין יתרה, כך שהיתרה הכוללת לא תשתנה.';
  openSheet(`<h3>למחוק את השובר?</h3>
    <p class="lead">השובר יוסר מהרשימה. ${effect} ההיסטוריה שלו נשמרת בגיליון.</p>
    ${infoBox(v)}
    <div class="sheet-actions"><button type="button" class="btn btn-danger-solid" id="goDelete">${ICON.trash}מחיקה</button><button type="button" class="btn btn-ghost" data-close>ביטול</button></div>`);
  $('#goDelete').onclick = e => guarded(e.currentTarget, async () => {
    const p = { voucherId: v.id };
    await api('remove', p, op(p));
    finish(`השובר נמחק · יתרה כוללת ${money(totalOf(S.vouchers))}`);
  });
}

/* ---------- הוספת שובר ---------- */
function openAdd() {
  if (!S.loaded || busy) return;
  const op = newOp();
  const companies = [...new Set(['HTZ', 'BUYME', ...companiesOf(S.vouchers)])];
  let company = '', htzType = null, other = false;
  openSheet(`<h3>הוספת שובר</h3>
    <p class="lead">השובר ייכנס לרשימה וליתרה הכוללת מיד אחרי השמירה.</p>
    <form id="addForm" novalidate autocomplete="off">
      <div class="field">
        <span class="label" id="coLbl">חברה</span>
        <div class="pchips" id="coChips" role="group" aria-labelledby="coLbl">${companies.map(c => `<button type="button" class="pchip" data-c="${esc(c)}">${esc(c)}</button>`).join('')}<button type="button" class="pchip" data-c="">חברה אחרת</button></div>
        <input class="input" id="fCompany" placeholder="שם החברה" aria-label="שם החברה" hidden style="margin-top:10px">
      </div>
      <div class="field" id="typeField" hidden>
        <label class="label" for="fType">סוג השובר</label>
        <div class="seg" id="typeHtz" hidden>${HTZ_TYPES.map(t => `<button type="button" data-t="${t}">${t}</button>`).join('')}</div>
        <input class="input" id="fType" list="typeList" placeholder="לדוגמה BUYME ALL"><datalist id="typeList"></datalist>
        <div class="hint" id="typeHint"></div>
      </div>
      <div class="field">
        <label class="label" for="fNumber">מספר שובר <span class="opt">(לא חובה)</span></label>
        <input class="input ltr" id="fNumber" placeholder="אפשר להשלים אחר כך" inputmode="text">
        <div class="err" id="numErr"></div>
      </div>
      <div class="field">
        <label class="label" for="fAmount">סכום בשובר</label>
        <div class="money-input"><input class="input" id="fAmount" inputmode="decimal" placeholder="0"><span>₪</span></div>
        <div class="quick" id="quickAmt">${[100, 200, 250, 300, 500].map(n => `<button type="button" data-a="${n}">${n} ₪</button>`).join('')}</div>
        <div class="err" id="amtErr"></div>
      </div>
      <div class="after" id="afterLine"></div>
      <div class="err" id="addErr"></div>
      <div class="sheet-actions"><button type="submit" class="btn btn-primary" id="saveAdd">הוספת שובר</button><button type="button" class="btn btn-ghost" data-close>ביטול</button></div>
    </form>`);

  const comp = $('#fCompany'), typ = $('#fType'), num = $('#fNumber'), amt = $('#fAmount');
  const currentCompany = () => normCompany(other ? comp.value : company);
  const sync = () => {
    const c = currentCompany();
    $$('#coChips .pchip').forEach(b => b.classList.toggle('on', other ? b.dataset.c === '' : b.dataset.c === company && !!company));
    comp.hidden = !other;
    $('#typeField').hidden = !c;
    const isHtz = c === 'HTZ';
    $('#typeHtz').hidden = !isHtz; typ.hidden = isHtz;
    if (isHtz) {
      if (!htzType && typ.value) htzType = normType('HTZ', typ.value);
      $$('#typeHtz button').forEach(b => b.classList.toggle('on', b.dataset.t === htzType));
      $('#typeHint').textContent = '';
    } else if (c) {
      const known = [...new Set(S.vouchers.filter(v => v.company === c).map(v => v.voucher_type))];
      $('#typeList').innerHTML = known.map(t => `<option value="${esc(t)}">`).join('');
      if (!typ.value && known.length === 1) typ.value = known[0];      // BUYME → BUYME ALL
      const n = normType(c, typ.value);
      $('#typeHint').textContent = n && n !== typ.value.trim() ? `יישמר כ: ${n}` : '';
    }
    // מספר כפול — בודקים כבר בזמן ההקלדה
    const nv = num.value.replace(/\s+/g, '');
    const dup = numKey(nv) && S.vouchers.find(v => numKey(v.voucher_number) === numKey(nv));
    $('#numErr').textContent = dup ? `המספר כבר קיים: ${labelOf(dup)}` : '';
    num.setAttribute('aria-invalid', String(!!dup));
    // סכום + איך ישתנה הסכום הכולל
    const a = parseAmount(amt.value);
    $('#amtErr').textContent = amt.value.trim() && !(a > 0) ? 'יש להזין סכום תקין' : '';
    $('#afterLine').innerHTML = a > 0 ? `היתרה הכוללת תעלה ל-${moneyHTML(totalOf(S.vouchers) + a)}` : '';
    return { c, dup };
  };
  $('#coChips').onclick = e => {
    const b = e.target.closest('.pchip'); if (!b) return;
    vibrate(10);
    if (b.dataset.c === '') { other = true; company = ''; htzType = null; typ.value = ''; sync(); comp.focus(); }
    else { other = false; company = b.dataset.c; htzType = null; typ.value = ''; sync(); }
  };
  $('#typeHtz').onclick = e => { const b = e.target.closest('button'); if (b) { vibrate(10); htzType = b.dataset.t; sync(); } };
  $('#quickAmt').onclick = e => { const b = e.target.closest('[data-a]'); if (b) { amt.value = b.dataset.a; sync(); } };
  [comp, typ, num, amt].forEach(el => el.addEventListener('input', sync));

  $('#addForm').onsubmit = e => {
    e.preventDefault();
    if (busy) return;
    const { c, dup } = sync();
    const type = c === 'HTZ' ? htzType : normType(c, typ.value);
    const number = num.value.replace(/\s+/g, '');
    const amount = parseAmount(amt.value);
    const err = !c ? 'יש לבחור חברה'
      : !type ? (c === 'HTZ' ? 'יש לבחור סוג: EAT ZONE, CHEF ZONE או ALL IN ZONE' : 'יש להזין סוג שובר')
      : dup ? 'מספר השובר כבר קיים ברשימה'
      : !(amount > 0) ? 'יש להזין סכום התחלתי'
      : '';
    $('#addErr').textContent = err;
    if (err) { vibrate([40, 60, 40]); return; }
    guarded($('#saveAdd'), async () => {
      const p = { company: c, type, number, amount };
      const data = await api('add', p, op(p));
      const id = data.result && data.result.id;
      const nv = id && findV(id);
      if (nv && !matches(nv)) { S.company = 'all'; S.q = ''; $('#search').value = ''; }
      if (S.tab !== 'vouchers') S.tab = 'vouchers';
      render();
      finish(`השובר נוסף · יתרה כוללת ${money(totalOf(S.vouchers))}`);
      if (nv) highlight(nv.id);
    });
  };
  sync();
}

function highlight(id) {
  const el = document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
  if (!el) return;
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  el.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'center' });
}

/* ---------- העתקה ---------- */
async function copyNumber(v) {
  try { await navigator.clipboard.writeText(v.voucher_number); }
  catch {
    const t = document.createElement('textarea'); t.value = v.voucher_number; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); } catch {}
    t.remove();
  }
  toast('מספר השובר הועתק');
}

/* =====================================================================
   אירועים
   ===================================================================== */
$('#list').addEventListener('click', e => {
  if (e.target.closest('[data-clear]')) return clearFilters();
  if (e.target.closest('[data-add]')) return openAdd();
  if (e.target.closest('[data-goused]')) return goUsed();
  const card = e.target.closest('.card'); if (!card || busy) return;
  const v = findV(card.dataset.id); if (!v) return;
  const b = e.target.closest('[data-act]');
  if (b && b.disabled) return;
  vibrate(10);
  const act = b ? b.dataset.act : 'details';
  ({ full: openFull, partial: openPartial, undo: openUndo, details: x => openDetails(x), addnum: x => openDetails(x, true), copy: copyNumber })[act](v);
});
$('#results').addEventListener('click', e => { if (e.target.closest('[data-clear]')) clearFilters(); });
$('#chips').addEventListener('click', e => {
  const b = e.target.closest('[data-company]'); if (!b) return;
  vibrate(10); S.company = b.dataset.company; render();
});
$('#usedSec').addEventListener('click', e => {
  if (e.target.closest('[data-toggle-used]')) { S.usedOpen = !S.usedOpen; render(); return; }
  const row = e.target.closest('.used-row'); if (!row || busy) return;
  const v = findV(row.dataset.id); if (!v) return;
  if (e.target.closest('[data-uundo]')) { if (!e.target.closest('[data-uundo]').disabled) openUndo(v); return; }
  openDetails(v);
});
$('#histChips').addEventListener('click', e => { const b = e.target.closest('[data-hist]'); if (b) { S.hist = b.dataset.hist; render(); } });
$('#histList').addEventListener('click', e => {
  const r = e.target.closest('button.feed-row'); if (!r || busy) return;
  const a = S.actions.find(x => x.id === r.dataset.aid); if (!a) return;
  const x = actionView(a);
  if (x.canUndo) openUndoOne(a); else if (x.v) openDetails(x.v);
});
$('#notices').addEventListener('click', e => { if (e.target.closest('[data-retry]')) refresh(true); });
$('#search').addEventListener('input', e => { S.q = e.target.value.trim(); render(); });
$('#searchClear').addEventListener('click', () => { S.q = ''; $('#search').value = ''; render(); $('#search').focus(); });
$('#addBtn').addEventListener('click', () => { vibrate(10); openAdd(); });
$('#refreshBtn').addEventListener('click', () => refresh(true));
$$('.tab').forEach(t => t.addEventListener('click', () => {
  if (S.tab === t.dataset.tab) return window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
  S.scroll[S.tab] = window.scrollY;
  S.tab = t.dataset.tab; vibrate(10); render();
  window.scrollTo(0, S.scroll[S.tab] || 0);
}));
function clearFilters() { S.company = 'all'; S.q = ''; $('#search').value = ''; render(); }
function goUsed() {
  S.scroll[S.tab] = window.scrollY; S.tab = 'history'; S.usedOpen = true; render();
  const a = $('#usedAnchor'); if (a) a.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
}

async function refresh(manual = false) {
  if (pending && !manual) return;
  try { await api('state'); if (manual) toast('הנתונים עודכנו'); }
  catch (e) { if (manual) toast(e.message || 'הרענון נכשל', 'bad'); }
}
// חוזרים לאפליקציה → מסנכרנים (שינויים ממכשיר אחר או מהגיליון)
const autoRefresh = () => { if (document.visibilityState === 'visible' && S.loaded && !busy && !sheetOpen && Date.now() - lastFetch > 4000) refresh(); };
document.addEventListener('visibilitychange', autoRefresh);
window.addEventListener('focus', autoRefresh);
window.addEventListener('online', () => refresh());
window.addEventListener('pageshow', e => { if (e.persisted) autoRefresh(); });

/* =====================================================================
   התחלה
   ===================================================================== */
async function start() {
  $('#hello').textContent = USER_NAME ? `היי ${USER_NAME}` : 'היי';
  try { S.labels = JSON.parse(localStorage.getItem(LABELS_KEY) || '{}') || {}; } catch { S.labels = {}; }
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    if (c && c.state) applyState(c.state, { cachedAt: c.at });            // תצוגה מיידית מהפעם הקודמת — רק לתצוגה
  } catch {}
  render();
  try { await api('state'); }
  catch (e) {
    if (!S.loaded) $('#list').innerHTML = `<div class="empty"><div class="t">${esc(e.message || 'לא ניתן לטעון את השוברים')}</div>
      בדוק את החיבור לאינטרנט. בהפעלה ראשונה: ודא שה-Apps Script פורסם כ״אפליקציית אינטרנט״ עם גישה ל״כל אחד״.<br>
      <button type="button" class="btn btn-soft" id="retryBtn">נסה שוב</button></div>`;
  }
}
$('#list').addEventListener('click', e => { if (e.target.closest('#retryBtn')) { $('#list').innerHTML = '<div class="skel"></div><div class="skel"></div>'; start(); } });

if (!configured) $('#setupView').hidden = false;
else { $('#app').hidden = false; $('#bottom').hidden = false; start(); }
</script>
</body>
</html>
